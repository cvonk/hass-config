                          value: 0
                        - color: "#ffff55"
                          value: 50
                        - color: "#ef8533"
                          value: 100
                        - color: "#ea3324"
                          value: 150
                        - color: "#8c1a4b"
                          value: 200
                        - color: "#731425"
                          value: 300
