    extra_styles: |
      :host {
        justify-self: center;
        align-self: center;
      }                    
      #graphic {
        width: 100%;
        height: auto;
        overflow: hidden;
        display: flex;
        justify-content: center;                      
      }
      @media screen and (max-width: 1200px) {
        #graphic {
          display: none; /* hide in last row, so it doesn't create an extra column on the right */
        }                    
      }
      /* width and height include padding/border */
      *, *::before, *::after {
        box-sizing: border-box;
      }
      .image-wrapper {
        position: relative;
        color: white;
      }
      .image-wrapper img {
        width: 100%;
        height: auto;
        display: block;
      }
      .flame-overlay {
        position: absolute;
        top: 30%;
        left: 65%;
        width: 22%;
        height: auto;
        scale: 0.8;
      }
      .flame {
        animation-name: flame-wobble;
        animation-duration: 3s;
        animation-timing-function: linear;
        animation-iteration-count: infinite;
      }
      .flame.one {
        animation-duration: 4s;
        animation-delay: 1s;
      }
      .flame.two {
        animation-duration: 3s;
        animation-delay: 2s;
      }
      .flame.three {
        animation-duration: 2.1s;
        animation-delay: 3s;
      }
      .flame.four {
        animation-duration: 3.2s;
        animation-delay: 4s;
      }
      .flame.five {
        animation-duration: 2.5s;
        animation-delay: 5s;
      }
      @keyframes flame-wobble {
        50% {
          transform: scale(1,1.2) translate(0, -30px) rotate(-2deg);
        }
      }
      .bulb-overlay {
        position: absolute;
        top: 0%;
        left: 28%;
        width: 36%;
        height: 36%;
        border-radius: 50%;
        overflow: hidden;
      }
      .bulb {
        width: 56%;
        aspect-ratio: 1;
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);  
        border-radius: 50%;
        box-shadow: 0px 0px 50px 3px white;
        animation: flash 10s linear infinite;
      }
      @keyframes flash {
        0%, 1.001%, 10%, 11.002%, 40%, 41.001%, 75%,
        80%, 82.002%, 83.001%, 83.003% {
          background: rgba(255, 255, 255, 0);
          box-shadow: 0 0 0 0 transparent;
        }
        1%, 11.001%, 12%, 39.999%, 41%, 75.5%, 75.501%, 81.001%,
        82%, 82.001%, 83%, 83.002%, 88% {
          background: rgba(255, 255, 255, 0.1);
          box-shadow: 0px 0px 30px 3px white;
        }
      }
      .drip-overlay {
        position: absolute;
        top: 75%;
        left: 38%;
        height: 5%;
        background: red;
        scale: 0.5;
      }
      .water-drip {
        margin: 0 auto;
        line-height: 0;
      }
      .water-drip:before { /* pointy top */
        content: "";
        position: absolute;
        top: -22px;
        left: 0;
        width: 0;
        height: 0;
        border-left: 10px solid transparent;
        border-right: 10px solid transparent;
        border-bottom: 30px solid rgba(255,255,255,1);
      }
      .water-drip { /* bottom circle */
        position: absolute;
        left: 50%;
        top: -30px;
        width: 20px;
        height: 20px;
        margin: 0 auto;
        background: #FFF;
        -moz-border-radius: 20px;
        -webkit-border-radius: 20px;
        border-radius: 20px;
        -moz-animation-name: water-drip;
        -webkit-animation-name: water-drip;
        animation-name: water-drip;
        -moz-animation-timing-function: cubic-bezier(.8,0, .91,.66);
        -webkit-animation-timing-function: cubic-bezier(.8,0, .91,.66);
        animation-timing-function: cubic-bezier(.8,0, .91,.66);
        -moz-animation-duration: 4s;
        -webkit-animation-duration: 4s;
        animation-duration: 4s;
        -moz-animation-iteration-count: infinite;
        -webkit-animation-iteration-count: infinite;
        animation-iteration-count: infinite;
      } 
      @keyframes water-drip {
        0% { transform: translateY(0); }
        80% { transform: translateY(1cqh); }
        100% { transform: translateY(10cqh); }
      }
  graphic_network: # ---------------------------------------------------------
    template: graphic_base
    custom_fields:
      graphic: |
        <div class="wrapper">
          <div class="main">
            <img src="/local/network.png" />
          <div class="overlay blue">
            <img src="/local/network-1.png" />
          </div>
          <div class="overlay green">
            <img src="/local/network-2.png" />
          </div>
          <div class="overlay red">
            <img src="/local/network-3.png" />
          </div>
          <div class="overlay yellow">
            <img src="/local/network-4.png" />
          </div>
        </div>
    extra_styles: |
      *, *::before, *::after {
        box-sizing: border-box;
      }
      :host {
        justify-self: center;
        align-self: center;
      }                    
      @media screen and (max-width: 1200px) {
        #graphic {
          display: none; /* hide in last row, so it doesn't create an extra column on the right */
        }                    
      }
      #graphic {
        border: 0;
        margin: 0;
        position: relative;
        scale: 1.1;
      }
      img {
        width: 100%;
        height: auto;
      }
      .overlay {
        position: absolute;
        bottom: 0;
        left: 0;
      }
      .overlay.blue {
        animation: blink-blue 2s linear infinite;
      }
      .overlay.green {
        animation: blink-green 3s linear infinite;
      }
      .overlay.red {
        animation: blink-red 5s linear infinite;
      }
      .overlay.yellow {
        animation: blink-yellow 6s linear infinite;
      }
      @keyframes blink-blue {
        0% {
          opacity: 0;
        }
        20% {
          opacity: 1;
        }
        80% {
          opacity: 0;
        }
      }                          
      @keyframes blink-green {
        0% {
          opacity: 0;
        }
        40% {
          opacity: 1;
        }
        100% {
          opacity: 0;
        }
      }                          
      @keyframes blink-red {
        0% {
          opacity: 1;
        }
        10% {
          opacity: 0;
        }
        50% {
          opacity: 1;
        }
      }                          
      @keyframes blink-yellow {
        0% {
          opacity: 1;
        }
        30% {
          opacity: 0;
        }
