                          bottom: 360px;
                          left: 33%;
                          transform: translateX(-50%);                            
                          font-weight: bold;
                          text-align: center;
                          font-size: 30px;
                        }
                        div::before {
                          content: '';
                          position: absolute;
                          width: 12px;
                          height: 40px;
                          left: -10px;
                          top: 0;
                          box-shadow: 35px 9px 2px -3px #b7aba385, 78px 4px 3px -2px #b7aba385, 117px 15px 2px -2px #b7aba385;
