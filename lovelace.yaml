      :host {
        justify-self: center;
        align-self: start;
        width: 100%;
      }                    
      @media screen and (max-width: 1200px) {
        #graphic {
          display: none; /* hide in last row, so it doesn't create an extra column on the right */
        }                    
      }
      .wrapper {
        position: relative;
        height: 70vh;
      }
      .drip {
        color: #0E87CC;
        width: 5%;
        position: absolute;
        top: 0;
        left: 50%;
        transform: translateX(-50%);
        animation-name: drip;
        animation-timing-function: cubic-bezier(.8,0, .91,.66);
        animation-duration: 2s;
        animation-iteration-count: infinite;
      }
      .ripple {
        width: 90%;
        position: absolute;
        bottom: 0;
        left: 50%;
        transform-origin: center center;
        transform: translateX(-50%) scale(0);
        animation-name: ripple;
        animation-duration: 2s;
        animation-iteration-count: infinite;
        animation-delay: 2s;
      }
      @keyframes drip {
        0% { transform: translateY(0); }
        100% { transform: translateY(65cqh); }
      }
      @keyframes ripple {
        0% { transform: translateX(-50%) scale(0); opacity: 1; }
        100% { transform: translateX(-50%) scale(1); opacity: 0;}
      }
