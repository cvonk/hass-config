            icon: mdi:sprinkler-variant
            size: wide
            style: |
              ha-dialog > div.content {
                background-image: linear-gradient(to right, rgba(14, 135, 204, 0.2), rgba(14, 135, 204, 0.1));
              }
              ha-dialog ha-dialog-header {
                background-color: rgba(14, 135, 204, 0.3);
              }                    
            card:
              type: custom:layout-card
              layout_type: custom:grid-layout
              layout:
                place-items: center stretch
                place-content: stretch stretch
                margin: 2vw
                grid-gap: 2vw
                grid-template-columns: 20vw repeat(1, 1fr)
                grid-template-rows: repeat(2, min-content)
                grid-template-areas: |
                  "graphic zones   "
                  "graphic programs"
                mediaquery:
                  "(max-width: 1200px)":
                    grid-template-columns: repeat(1, 1fr)
                    grid-template-rows: repeat(3, min-content)
                    grid-template-areas: |
                      "zones   "
                      "programs"
                      "graphic "
              cards:
                - type: markdown # https://codepen.io/abehjat/pen/oXMENv
                  view_layout:
                    grid-area: graphic
                  content: |-
                    <a href="drip"></a>
                    <b href="ripple"></b>
                  card_mod:
                    style:
                      .: >
                        ha-card {
                          border-width: 0;
                          box-shadow: none;
                          backdrop-filter: none !important;
                          overflow: hidden;
                        }
                        @media screen and (max-width: 1200px) {
                          ha-card {
                            display: none; /* hide in last row, so it doesn't create an extra column on the right */
                          }
                        }
                      ha-markdown $ ha-markdown-element: >
                        a, b {
                          display: block;
                          margin: 175px auto;
                        }
                        a {  /* drip animation */
                          position: relative;
                          width: 20px;
                          height: 20px;
                          top: -30px;
                          margin: 0 auto;
                          background: #FFF;
                          -moz-border-radius: 20px;
                          -webkit-border-radius: 20px;
                          border-radius: 20px;
                          -moz-animation-name: drip;
                          -webkit-animation-name: drip;
                          animation-name: drip;
                          -moz-animation-timing-function: cubic-bezier(1,0,.91,.19);
                          -webkit-animation-timing-function: cubic-bezier(1,0,.91,.19);
                          animation-timing-function: cubic-bezier(1,0,.91,.19);
                          -moz-animation-duration: 2s;
                          -webkit-animation-duration: 2s;
                          animation-duration: 2s;
                          -moz-animation-iteration-count: infinite;
                          -webkit-animation-iteration-count: infinite;
                          animation-iteration-count: infinite;
                        } 
                        a:before {  /* drip shape */
                          content: "";
                          position: absolute;
                          width: 0;
                          height: 0;
                          top: -22px;
                          border-left: 10px solid transparent;
                          border-right: 10px solid transparent;
                          border-bottom: 30px solid rgba(255,255,255,1);
                        }
                        @keyframes drip {
                          to {
                            top: 190px;
                          }
                        }
                        b { /* ripple shape and animation */
                          position: relative;
                          opacity: 0;
                          width: 2px;
                          height: 1px;
                          top: 0;
                          border: cornflowerblue 7px solid; // #FFF 7px solid;
                          -moz-border-radius: 200px / 100px;
                          -webkit-border-radius: 200px / 100px;
                          border-radius: 200px / 100px;
                          -moz-animation-name: ripple;
                          -webkit-animation-name: ripple;
                          animation-name: ripple;
                          -moz-animation-delay: 2s;
                          -webkit-animation-delay: 2s;
                          animation-delay: 2s;
                          -moz-animation-duration: 2s;
                          -webkit-animation-duration: 2s;
                          animation-duration: 2s;
                          -moz-animation-iteration-count: infinite;
                          -webkit-animation-iteration-count: infinite;
                          animation-iteration-count: infinite;
                        } 
                        @keyframes ripple {
                          from {
                            opacity: 1;
                          }
                          to {
                            width: 200px;
                            height: 100px;
                            border-width: 1px;
                            top: -50px;
                            opacity: 0;
                          }
                        } 
                        b:after { /* ripple-2 shape and animation */
                          content: "";
                          position: absolute;
                          opacity: 0;
                          top: -5px;
                          left: -5px;
                          width: 2px;
                          height: 1px;
                          border: cornflowerblue 5px solid; // #FFF 5px solid;
                          -moz-border-radius: 200px / 100px;
                          -webkit-border-radius: 200px / 100px;
                          border-radius: 200px / 100px;
                          -moz-animation-name: ripple-2;
                          -webkit-animation-name: ripple-2;
                          animation-name: ripple-2;
                          -moz-animation-duration: 2s;
                          -webkit-animation-duration: 2s;
                          animation-duration: 2s;
                          -moz-animation-iteration-count: infinite;
                          -webkit-animation-iteration-count: infinite;
                          animation-iteration-count: infinite;
                        } 
                        @keyframes ripple-2 {
                          0% {
                            opacity: 1;
                          }
                          50% {
                            opacity: 0;
                          }
                          100% {
                            width: 66px;
                            height: 33px;
                            border-width: 1px;
                            top: 40px;
                            left: 66px;
                          }
                        }

