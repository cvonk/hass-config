    variables: schedule_entity
      pending_entity
      loader_script_entity
    size: 80%
    show_state: true
    aspect_ratio: 1/1
    state:
      - value: "on"
        styles:
          icon:
            - color: cornflowerblue
    state_display: |
      [[[
