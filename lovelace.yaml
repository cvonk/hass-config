                      line-height: 30px !important;
                    }
                    #root {
                      padding: 1vw 1vw 1vw 1vw !important;
                    }
            card:
              title: "UPS"
              type: grid
              square: false
              columns: 1
              cards:
                - entity: sensor.ups_battery_charge
                  name: >
                    [[[
                        return states['sensor.ups_status']?.state;
                    ]]]
                  type: custom:button-card
                  template: above_below_bar
                  variables:
                    warning_below: 30
                    warning_above: 100
                    max_value: 100

          - type: custom:mod-card # Disk usage
            card_mod:
              style:
                .: |
                  ha-card, ha-card::before {
                    border-radius: 0; 
                    border-width: 0;
                    box-shadow: none;
                    backdrop-filter: none;
                    background: transparent;
                  }
                hui-grid-card:
                  $: |
                    .card-header {
                      padding: 0 1vw !important;
                      font-size: max(2.0vw, 12pt) !important;
                      line-height: 30px !important;
                    }
                    #root {
                      padding: 1vw 1vw 1vw 1vw !important;
                    }
            card:
              title: "Disk usage"
              type: grid
              square: false
              columns: 1
              cards:
                - entity: sensor.nas_volume_1_volume_used
                  name: "NAS"
                  type: custom:button-card
                  template: above_below_bar
                  variables:
                    warning_below: 0
                    warning_above: 85
                    max_value: 100

                - entity: sensor.backup_volume_1_volume_used
                  name: "Backup"
                  type: custom:button-card
                  template: above_below_bar
                  variables:
                    warning_below: 0
                    warning_above: 85
                    max_value: 100

  #################################################
  #                                               #
  #                 FIRE VIEW                     #
  #                                               #
  #################################################

  - title: "Fire"
    path: fire
    icon: mdi:fire
    background: linear-gradient(to right, rgba(255, 59, 48, 0.2), rgba(255, 59, 48, 0.1)), url(/local/bg.jpg)

    type: custom:layout-card
    layout_type: grid-layout
    layout:
      margin: 2vw 2vw 0 0 /* when sidebar is hidden, it still uses a cell in the grid */
      padding: 0;
      place-items: stretch stretch
      grid-gap: 2vw
      grid-template-columns: minmax(260px, 20%) 1fr
      grid-template-rows: 1fr 100px  /* leave space for navbar */
      grid-template-areas: |
        "graphic cards"
        ".       .    "
      mediaquery:
        "(max-width: 1200px)":
          grid-template-columns: 0 1fr /* graphic hidden in 0-width column */
    cards:
      #=======
      # NAVBAR
      #=======

      - type: custom:navbar-card
        template: main_menu
        view_layout:
          grid-area: graphic

      #========
      # GRAPHIC
      #========

      - type: custom:button-card
        template: graphic_fire
        view_layout:
          grid-area: graphic

      #======
      # CARDS
      #======

      - type: custom:layout-card
        view_layout:
          grid-area: cards
        layout_type: grid-layout
        layout:
          margin: 0
          padding: 0;
          grid-template-columns: repeat(auto-fit, minmax(120px, 1fr))
          place-items: stretch stretch
          grid-gap: 1vw
        cards:
          - name: "Fire Alarm"
            type: custom:button-card
            template: base
            aspect_ratio: 1/1
            entity: alarm_control_panel.fire_alarm
            triggers_update:
              - alarm_control_panel.fire_alarm
              - sensor.fire_status
            label: >-
              [[[
                  const id = states['sensor.fire_status']; 
                  return id?.state ? id.state : '';
                  // workaround not updating https://github.com/thomasloven/hass-browser_mod/issues/981
                  //let template = "[[[ const id = states['sensor.fire_status']; return id?.state ? id.state : ''; ]]]";
                  //return template;
              ]]]
            show_label: true
            tap_action:
              action: call-service
              service: script.toggle_fire_alarm
            styles:
              grid:
                - align-items: start #
                - grid-template-areas: |
                    "n"
                    "."
                    "s"
                    "."
                    "l"
                - grid-template-columns: 1fr
                - grid-template-rows: min-content 1vw min-content 1vw min-content

              name:
                - justify-self: start # align to the left in the grid area
                - line-height: 121%
                - font-size: 30px
              state:
                - justify-self: start
                - line-height: 115%
                - font-size: 20px
              label:
                - justify-self: start
                - line-height: 115%
                - font-size: 20px

          - type: custom:layout-card
            layout_type: grid-layout
            layout:
              grid-gap: 2vw
              grid-template-columns: repeat(1, 1fr)
            cards:
              - type: custom:auto-entities
                show_empty: false
                filter:
                  include:
                    - domain: binary_sensor
                      entity_id: /nest_protect_.*_status/
                      state: "on"
                      options:
                        icon: mdi:fire
                        type: custom:multiple-entity-row
                        show_state: true
                        secondary_info: last-changed

background:
  opacity: 100
  alignment: center
  size: cover
  repeat: repeat
  attachment: fixed
  #image: /api/image/serve/33e5f7514c86d628e8141caada05bc6f/original
  image: /local/bg.jpg

theme: Frosted Glass Dashboard Theme
path: Default
