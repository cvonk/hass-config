                    box-shadow: none;
                    backdrop-filter: none;
                    background: transparent;
                  }
                hui-grid-card:
                  $: |
                    .card-header {
                      padding: 0 1vw !important;
                      font-size: max(2.0vw, 12pt) !important;
                      line-height: 30px !important;
                    }
                    #root {
                      padding: 1vw 1vw 1vw 1vw !important;
                    }
            card:
              title: "Ping"
              type: grid
              square: false
              columns: 4
              cards:
