        position: absolute;
        width: 100%;
        height: 100%;
        top: 0;
        left: 0;
        background: inherit;
        border-radius: 2.5vmin;
        transform-origin: center bottom 0;
        transform: translateY(-85%) scale(0.75) rotate(var(--angle));
        animation: wind ease-out 8s infinite;
      }
      b:first-child {
        --angle: var(--l-angle);
      }
      b:empty::after { /* leaf */
        content: "";
        position: absolute;
        left: -100%;
        top: -85%;
        width: 300%;
        height: 100%;
        background: green;
        border-radius: 75%;
      }
      @keyframes wind {
        10% {
          transform: translateY(-85%) scale(0.75) rotate(var(--angle));
        }
        40% {
          animation-timing-function: ease;
          transform: translateY(-85%) scale(0.75) rotate(calc(var(--angle) + 5deg));
        }
      }
  graphic_cameras: # ---------------------------------------------------------
    template: graphic_base
    custom_fields:
      graphic: |
        <div class="wrapper">
          <div class="overlay spot"></div>
          <img class="overlay eyes" src="/local/cameras-eyes.png"></img>
          <img class="overlay eyelids" src="/local/cameras-eyelids.png"></img>
          <img class="main body" src="/local/cameras-body.png"></img>
        </div>
    extra_styles: |
      *, *::before, *::after {
        box-sizing: border-box;
      }
      :host {
        justify-self: center;
        align-self: center;
      }                    
      @media screen and (max-width: 1200px) {
        #graphic {
          display: none; /* hide in last row, so it doesn't create an extra column on the right */
        }                    
      }
      .wrapper {
        position: relative;
        scale: 1.2;
      }
      img {
        width: 100%;
        height: auto;
      }
      .overlay {
        position: absolute;
        width: 100%;
        height: auto;
        top: 0%;
        bottom: 0%;
      }
      .overlay.eyelids {
        top: 7%;
        animation: eyelids 500ms infinite, delay-animation 10s linear infinite;
        animation-delay: 3s;
      }
      .overlay.spot {
        height: 100%;
        background: #F7F5C5;
      }
      .main.body,
      .overlay.spot {
        animation: spotlight 25s infinite;
      }
      @keyframes spotlight {
        0% { clip-path: ellipse(30% 30% at 42% 45%); }
        50% { clip-path: ellipse(32% 32% at 60% 50%); }
        100% { clip-path: ellipse(30% 30% at 42% 45%); }
      }
      @keyframes eyelids {
        0% { top: 7%; }
        50% { top: 11%; }
        100% { top: 7%; }
      }
      @keyframes delay-animation {
        0% { visibility: visible; }
        5% { visibility: hidden; }
        100% { visibility: hidden; }
      }
