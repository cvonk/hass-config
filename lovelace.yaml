                      type: custom:mini-graph-card
                      entities:
                        - entity: sensor.terracehabitat_aqi
                      hour24: true
                      hours_to_show: 720
                      icon: mdi:waves
                      line_width: 5
                      lower_bound: 0
                      show:
                        icon: true
                        icon_adaptive_color: true
                      smoothing: false
                      upper_bound: 250
                      color_thresholds:
