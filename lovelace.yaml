                      icon: mdi:waves
                      name: Particles ≤ 1 µm
                    - entity: sensor.terracehabitat_pm2_5
                      icon: mdi:waves
                      name: Particles ≤ 2.5 µm
                    - entity: sensor.terracehabitat_pm10
                      icon: mdi:waves
