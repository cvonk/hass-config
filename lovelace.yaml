  above_below_bar: # ---------------------------------------------------------
    variables: # inspired by https://community.home-assistant.io/t/home-assistant-card-replacing-former-bar-card-config
      max_value: 100
      warning_below: 30
      warning_above: 70
      warning_below_bar_color: "255, 165, 0"
      normal_bar_color: "100, 149, 237"
      warning_above_bar_color: "255, 165, 0"
    name: >
      [[[ function removeSubstrings(str, subs) {
            subs.forEach(s => str = str.replace(new RegExp(s, 'gi'), ''));
            return str.trim();
          }
          return removeSubstrings(entity.attributes.friendly_name,
            ['sensor', 'level', 'battery', ':']); ]]]
    show_state: true
    styles:
      grid:
        - grid-template-areas: '"i n s"'
        - grid-template-columns: 50px 1fr
      name:
        - width: 100%
        - color: white
        - font-weight: 400
        - font-size: 16px
        - text-align: left
      card:
        - color: grey # for elements other than icon and name
        - height: 26px
        - padding: 4px
        - font-size: 1em
        - border: 2px solid var(--ha-color);
        - border-radius: 12px 0px 0px 12px;
        - background: |-
            [[[
              const pct = Math.min(100, (entity.state / variables.max_value) * 100);
              const pctLow = Math.min(100, (variables.warning_below / variables.max_value) * 100);
              const pctHigh = Math.min(100, (variables.warning_above / variables.max_value) * 100);

              const colorMap = [
                {threshold: pctLow, color: variables.warning_below_bar_color},
                {threshold: pctHigh, color: variables.normal_bar_color},
                {threshold: 100, color: variables.warning_above_bar_color}
              ];
              const current = colorMap.find(entry => pct <= entry.threshold);
              const barColor = current ? current.color : '127,127,127';

              return `linear-gradient(to right,
                rgba(${barColor}, 0.9) 0%,
                rgba(${barColor}, 0.6) ${pct}%,
                rgba(${barColor}, 0.3) ${pct}%,
                rgba(${barColor}, 0.1) 100%)`;
            ]]]
  ts_bar: # ------------------------------------------------------------------
    variables: # inspired by https://community.home-assistant.io/t/home-assistant-card-replacing-former-bar-card-config/743050/30
      max_value: 100
    name: "[[[ return entity.attributes.friendly_name; ]]]"
    entity: "[[[ return entity; ]]]"
    state_display: |
      [[[
        const value = entity.state;
        if (value == "unavailable" || value == "unknown") {
            return value;
        }
        const unit = entity.attributes.unit_of_measurement
        if (unit) {
            return Math.round(value) + ' ' + unit;
        }
        return Math.round(value);
      ]]]
    show_state: true
    show_icon: true
    styles:
      grid:
        - grid-template-areas: '"i n"'
        - grid-template-rows: 1fr
        - grid-template-columns: 0px 1fr
      name:
        - width: 100%
        - color: white
        - font-weight: 500
        - text-align: left
      icon:
        - color: black
      card:
        - color: lightgrey
        - font-size: 1.1em
        - height: 26px
        - padding: 14px
        - border-radius: 8px
        - background: |-
            [[[
              const pct =  Math.min(100, (entity.state / variables.max_value) * 100);

              const colorMap = [
                { threshold: 10,  color: '0,128,0' },
                { threshold: 20,  color: '50,205,50' },
                { threshold: 30,  color: '144,238,144' },
                { threshold: 40,  color: '154,205,5' },
                { threshold: 50,  color: '255,255,0' },
                { threshold: 60,  color: '255,165,0' },
                { threshold: 70,  color: '255,0,0' },
                { threshold: 80,  color: '128,0,0' },
                { threshold: 90,  color: '255,140,0' },
              ];
              const current = colorMap.find(entry => pct <= entry.threshold);
              const bar = current ? current.color : '255,0,0';

              return `linear-gradient(to right,
                rgba(${bar},0.9) 0%,
                rgba(${bar},0.6) ${pct}%,
                rgba(${bar},0.3) ${pct}%,
                rgba(${bar},0.1) 100%)`;
            ]]]

  card_title: # --------------------------------------------------------------
    tap_action: # https://ui-lovelace-minimalist.github.io/UI/usage/cards/card_title/
      action: "none"
    show_icon: false
    show_label: true
    show_name: true
    styles:
