            style: |
              ha-card {
                box-shadow: none;
                background: none;
                backdrop-filter: none !important
              }
    styles:
      grid:
        - grid-template-areas: |
            "title"
            "graph"
        - grid-template-rows: min-content min-content
      card:
        - padding: 0px
        - border-radius: 25px
        - box-shadow: none
