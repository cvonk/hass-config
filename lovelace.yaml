    extra_styles: |
      *, *::before, *::after {
        box-sizing: border-box;
      }
      :host {
        justify-self: center;
        align-self: center;
      }                    
      @media screen and (max-width: 1200px) {
        #graphic {
          display: none; /* hide in last row, so it doesn't create an extra column on the right */
        }                    
      }
      #graphic {
        border: 0;
        margin: 0;
        position: relative;
      }
      svg {
        width: 100%;
        height: auto;
      }
      .main {
        animation: move-main 4s infinite alternate;
      }
      .overlay {
        position: absolute;
        bottom: 0;
        left: 0;
      }
      .overlay.water {
        animation: move-water 4s infinite alternate;
      }
      .overlay.girl {
        animation: move-girl 4s infinite alternate;
      }
      .overlay.floats {
          animation: move-floats 4s infinite alternate;
      }
      @keyframes move-main {
        0% { transform: rotate(0); }
        50% { transform: rotate(4deg); }
        100% { transform: rotate(0); }
      }         
      @keyframes move-water {
        0% { transform: rotate(0); }
        50% { transform: rotate(-2deg); }
        100% { transform: rotate(0); }
      }                          
      @keyframes move-girl {
        0% { transform: rotate(0); }
        50% { transform: rotate(-3deg); }
        100% { transform: rotate(0); }
      }
      @keyframes move-floats {
        0% { transform: rotate(0); }
        50% { transform: rotate(-1deg); }
        100% { transform: rotate(0); }
      }
