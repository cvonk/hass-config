            <path class="flame-main five" fill="#FDBA16" d="M62.049,104.171c0,0-15.645,67.588,10.529,77.655C98.753,191.894,69.033,130.761,62.049,104.171z"/>
            <path class="flame" fill="#F36E21" d="M101.011,112.926c0,0,8.973,10.519,4.556,16.543C99.37,129.735,106.752,117.406,101.011,112.926z"/>
            <path class="flame one" fill="#F36E21" d="M55.592,126.854c0,0-3.819,13.29,2.699,16.945C64.038,141.48,55.907,132.263,55.592,126.854z"/>
            <path class="flame two" fill="#F36E21" d="M54.918,104.595c0,0-3.959,6.109-1.24,8.949C56.93,113.256,52.228,107.329,54.918,104.595z"/>
          </svg>
        </div>
    extra_styles: |
      :host {
        justify-self: center;
        align-self: center;
      }                    
      @media screen and (max-width: 1200px) {
        #graphic {
          display: none; /* hide in last row, so it doesn't create an extra column on the right */
        }                    
      }
      #graphic {
        border: 0;
        margin: 0;
        position: relative;
      }
      .mo-fire {
        width: 100%;
        height: auto;
      }
      .mo-fire svg {
        width: 100%;
        height: auto;
      }
      .flame-main {
        animation-name: flameWobble;
        animation-duration: 3s;
        animation-timing-function: linear;
        animation-iteration-count: infinite;
      }
      .flame-main.one {
        animation-duration: 4s;
        animation-delay: 1s;
      }
      .flame-main.two {
        animation-duration: 3s;
        animation-delay: 2s;
      }
      .flame-main.three {
        animation-duration: 2.1s;
        animation-delay: 3s;
      }
      .flame-main.four {
        animation-duration: 3.2s;
        animation-delay: 4s;
      }
      .flame-main.five {
        animation-duration: 2.5s;
        animation-delay: 5s;
      }
      .flame {
        animation-name: flamefly;
        animation-duration: 2s;
        animation-timing-function: linear;
        animation-iteration-count: infinite;
        opacity: 0;
        transform-origin: 50% 50% 0;
      }
      .flame.one {
        animation-delay: 1s;
        animation-duration: 3s;
      }
      .flame.two {
        animation-duration: 5s;
        animation-delay: 1s;
      }
      @keyframes flameWobble {
        50% {
          transform: scale(1,1.2) translate(0, -30px) rotate(-2deg);
        }
      }
      @keyframes flamefly {
        0%{
          transform: translate(0) rotate(180deg);
        }
        50% {
          opacity: 1;
        }
        100% {
          transform: translate(-20px, -100px) rotate(180deg);
          opacity: 0;
        }

  cpu_ram_sd_temp:
    template:
      - base
      - circle
    variables:
      cpu_id: null
      ram_id: null
      sd_id: null
      load_id: null
      state_on: >
        [[[ return true; ]]]
      circle_input: >
        [[[ 
            let value = states[variables.load_id];
            if (value) {
              return Math.round(parseFloat(value.state) * 100);
            }
            return value;
        ]]]
      circle_input_unit: "%"
    aspect_ratio: 1/1
    show_state: false
    styles:
      card:
        - border-radius: 10%
        - padding: 10%
        - font-size: 10px
        - text-transform: capitalize
        - color: >-
            [[[
              return variables.state_on ? '#4b5254' : '#97989c';
            ]]]
      grid:
        - grid-template-areas: |
            "i   circle"
            "n   n   "
            "cpu cpu "
            "ram ram "
            "sd  sd  "
        - grid-template-columns: 1fr 1fr
        - grid-template-rows: 1fr min-content min-content min-content min-content
      name:
        - font-weight: bold
        - font-size: 13px
        - align-self: middle
        - justify-self: start
        - padding-bottom: 4px
      img_cell:
        - justify-content: start
        - align-items: start
        - margin: none
      icon:
        - color: "cornflowerblue"
        - width: 50%
        - margin-left: 3%
        - margin-top: -6%
      custom_fields:
        cpu:
          - padding-bottom: 2px
          - align-self: middle
          - justify-self: start
          - --text-color-sensor: '[[[ if (states[variables.cpu_id].state > 80) return "red"; ]]]'
        ram:
          - padding-bottom: 2px
          - align-self: middle
          - justify-self: start
          - --text-color-sensor: '[[[ if (states[variables.ram_id].state > 80) return "red"; ]]]'
        sd:
          - align-self: middle
          - justify-self: start
          - --text-color-sensor: '[[[ if (states[variables.sd_id].state > 80) return "red"; ]]]'
    custom_fields:
      cpu: |
        [[[
          return `<ha-icon icon="mdi:server" style="width: 12px; height: 12px; color: deepskyblue;"></ha-icon>
          CPU:&nbsp;${states[variables.cpu_id].state}%`
        ]]]
      ram: |
        [[[
          return `<ha-icon icon="mdi:memory" style="width: 12px; height: 12px; color: deepskyblue;"></ha-icon>
          RAM:&nbsp;${states[variables.ram_id].state}%`
        ]]]
      sd: |
        [[[
          return `<ha-icon icon="mdi:harddisk" style="width: 12px; height: 12px; color: deepskyblue;"></ha-icon>
          SD:&nbsp;${states[variables.sd_id].state}%`
        ]]]

views:
  #################################################
  #                                               #
  #                 HOME VIEW                     #
  #                                               #
  #################################################

  - title: "Home"
    path: Default
    icon: mdi:home
    background: linear-gradient(to right, rgba(255, 255, 255, 0.2), rgba(255, 255, 255, 0.1)), url(/local/bg.jpg)

    type: custom:layout-card
    layout_type: grid-layout
    layout:
      height: calc(100vh - 2vw - var(--header-height)) /* 2vw margin, 8px padding */
      margin: 2vw 2vw 0 0 /* when sidebar is hidden, it still uses a cell in the grid */
      padding: 0;
      grid-gap: 2vw
      grid-template-columns: minmax(260px, 25%) 1fr
      grid-template-rows: 1fr 100px  /* leave space for navbar */
      grid-template-areas: |
        "sidebar cards"
        ".       .    "
      mediaquery:
        "(max-width: 1200px)":
          grid-template-columns: 0 1fr /* graphic hidden in 0-width column */
    cards:
      - name: "Set theme to 'Frosted Glass cvonk' in user profile"
        type: custom:button-card
        view_layout:
          grid-area: 1 / 1 / 2 / 2
        tap_action:
          action: navigate
          navigation_path: /profile
        styles:
          card:
            - display: >
                [[[
                  return (hass.themes.theme === 'tablet') || (hass.themes.theme === 'tablet_frosted_glass') || (hass.themes.theme === 'Frosted Glass cvonk')
                      ? 'none'
                      : 'initial';
                ]]]
          name:
            - z-index: 1
            - overflow: visible
            - color: red
            - font-weight: bolder
            - font-size: xxx-large
            - background: yellow

      #=======
      # NAVBAR
      #=======

      - type: custom:navbar-card # Navigation bar ----------------------------
        template: main_menu
        view_layout:
          grid-area: sidebar

      #========
      # SIDEBAR
      #========

      - type: custom:mod-card # Side bar -------------------------------------
        view_layout:
          grid-area: sidebar
        card_mod:
          style: |
            ha-card, ha-card::before {
              border: none;
              box-shadow: none;
              backdrop-filter: none;
              background: transparent;
            }
            @media screen and (max-width: 1200px) {
              ha-card {
                display: none; /* still takes up a grid cell */
                height: 0;
                margin: 2vw;
              }
            }
        card:
          type: custom:layout-card
          layout_type: grid-layout
          layout:
            height: 85vh
            place-items: center center
            place-content: stretch stretch
            grid-gap: 2vw
            grid-template-columns: 1fr
            grid-template-rows: min-content 1fr min-content
            grid-template-areas: |
              ". time"
              ". graphic"
              ". weather"
          cards:
            - type: markdown # time ------------------------------------------
              view_layout:
                grid-area: time
              content: >-
                <center>
                  <h1>{{ now().strftime('%H:%M') }}</h1>
                  {% if strptime(states('sensor.date'), '%Y-%m-%d').day != None %}
                  {%   set days = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'] %}
                  {%   set months = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'] %}
                  <p>{{   days[now().weekday()] }}<br>
                  {{   strptime(states('sensor.date'), '%Y-%m-%d').day }} {{ months[now().month-1] }}</p>
                  {% endif %}                
                </center>
              card_mod:
                style:
                  .: >
                    ha-card, ha-card::before {
                      border-width: 0;
                      box-shadow: none;
                      backdrop-filter: none;
                      background: transparent;
                    }
                    ha-card ha-markdown {
                      padding: 0;
                    }
                  "ha-markdown $ ha-markdown-element": >
                    h1 {
                      margin: 0;
                      font-size: 5.2vw;
                      font-weight: 300;
                      line-height: 4.3vw;
                      letter-spacing: 0.11vw;
                      color: rgba(255, 255, 255, 0.8);
                    }
                    p {
                      font-size: 1.42vw;
                      line-height: 2vw;
                      letter-spacing: 0.07vw;
                      color: rgba(255, 255, 255, 0.8); // #6a7377;
                    }

            - template: graphic_house # graphic ------------------------------
              type: custom:button-card
              view_layout:
                grid-area: graphic

            - entity: weather.pirateweather # weather ------------------------
              type: custom:weather-chart-card
              view_layout:
                grid-area: weather
              show_main: false
              show_humidity: false
              show_pressure: false
              show_sun: false
              show_wind_speed: false
              show_wind_direction: false
              animated_icons: true
              icon_style: style2
              icons_size: 30
              forecast:
                style: style2
                type: daily
                show_temperature: true
                chart_datetime_color: white
                show_wind_forecast: false
              card_mod:
                style:
                  .: >
                    :host {
                      width: 85%;
                      overflow: hidden;
                    }
                    ha-card, ha-card::before {
                      padding: 0;
                      margin: 0;
                      border-width: 0;
                      box-shadow: none;
                      backdrop-filter: none;
                      background: transparent;
                    }
                    ha-card > .card {
