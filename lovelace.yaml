                  name: "Rtr"

                - type: custom:button-card # Modem Status
                  template: netstat
                  variables:
                    graph_color: cornflowerblue
                  entity: sensor.cable_modem_connection_status
                  name: "Modem"

                - type: custom:button-card # DNS Ping delay
                  template: netstat
                  variables:
                    graph_color: cornflowerblue
                  entity: sensor.ping_dns_round_trip_time_average
                  name: "DNS"

                - type: custom:button-card # Google Ping delay
                  template: netstat
                  variables:
                    graph_color: cornflowerblue
                  entity: sensor.ping_google_round_trip_time_average
                  name: "Google"

          - type: custom:mod-card # UPS
            card_mod:
              style:
                .: |
                  ha-card, ha-card::before {
                    border-radius: 0; 
                    border-width: 0;
                    box-shadow: none;
                    backdrop-filter: none;
                    background: transparent;
                  }
                hui-grid-card:
                  $: |
                    .card-header {
                      padding: 0 1vw !important;
