                      ha-card {
                        border: none !important;
                      }
                  cards:
                    - entity: sensor.ups_battery_charge
                      name: >
                        [[[
                            return states['sensor.ups_status']?.state;
                        ]]]
                      type: custom:button-card
                      template: above_below_bar
                      variables:
                        warning_below: 30
                        warning_above: 100
                        max_value: 100

                - title: "Disk usage"
                  type: grid
                  columns: 1
                  square: false
                  view_layout:
                    grid-area: diskusage
                  card_mod:
                    style: |
                      ha-card {
                        border: none !important;
                      }
                  cards:
                    - entity: sensor.nas_volume_1_volume_used
                      name: "NAS"
                      type: custom:button-card
                      template: above_below_bar
                      variables:
                        warning_below: 0
                        warning_above: 85
                        max_value: 100

                    - entity: sensor.backup_volume_1_volume_used
                      name: "Backup"
                      type: custom:button-card
                      template: above_below_bar
                      variables:
                        warning_below: 0
                        warning_above: 85
                        max_value: 100

          - name: "Fire" # ---------------------------------------------------
            entity: sensor.fire_status
            type: custom:button-card
            template: footer
            variables:
              active_id: sensor.nr_of_fire_problems
              notify: >-
                [[[
                  let id = states['sensor.nr_of_fire_problems'];
                  if (id) return parseInt(id.state);
                ]]]
            tap_action:
              action: fire-dom-event
              browser_mod:
                service: browser_mod.popup
                data:
                  popup_card_id: fire_popup

          - popup_card_id: fire_popup # --------------------------------------
            type: custom:popup-card
            title: "Fire Alarm"
            icon: mdi:fire
            #size: wide
            style: >
              ha-dialog > div.content {
                background-image: linear-gradient(to right, rgba(255, 165, 0, 0.2), rgba(255, 165, 0, 0.1));
              }
              ha-dialog ha-dialog-header {
                background-color: rgba(255, 165, 0, 0.3);
              }                    
            card:
              type: custom:layout-card
              layout_type: custom:grid-layout
              layout:
                place-items: center stretch
                place-content: stretch stretch
                margin: 2vw
                grid-gap: 2vw
                grid-template-columns: 1fr 2fr
                grid-template-rows: repeat(2, min-content)
                grid-template-areas: |
                  "graphic on_off_button  "
                  "graphic smoke_detectors"
                mediaquery:
                  "(max-width: 1200px)":
                    grid-template-columns: repeat(1, 1fr)
                    grid-template-rows: repeat(3, min-content)
                    grid-template-areas: |
                      "on_off_button  "
                      "smoke_detectors"
                      "graphic        "
              cards:
                - type: custom:html-card # https://codepen.io/deepakkv/pen/EKpYMg
                  view_layout:
                    grid-area: graphic
                  content: |-
                    <div class="mo-fire">
                      <svg version="1.1" id="Layer_1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" x="0px" y="0px"
                        viewBox="0 0 125 190" enable-background="new 0 0 125 189.864" xml:space="preserve">
                        <path class="flame-main" fill="#F36E21" d="M76.553,186.09c0,0-10.178-2.976-15.325-8.226s-9.278-16.82-9.278-16.82s-0.241-6.647-4.136-18.465
                          c0,0,3.357,4.969,5.103,9.938c0,0-5.305-21.086,1.712-30.418c7.017-9.333,0.571-35.654-2.25-37.534c0,0,13.07,5.64,19.875,47.54
                          c6.806,41.899,16.831,45.301,6.088,53.985"/>
                        <path class="flame-main one" fill="#F6891F" d="M61.693,122.257c4.117-15.4,12.097-14.487-11.589-60.872c0,0,32.016,10.223,52.601,63.123
                          c20.585,52.899-19.848,61.045-19.643,61.582c0.206,0.537-19.401-0.269-14.835-18.532S57.576,137.656,61.693,122.257z"/>
                        <path class="flame-main two" fill="#FFD04A" d="M81.657,79.192c0,0,11.549,24.845,3.626,40.02c-7.924,15.175-21.126,41.899-0.425,64.998
                          C84.858,184.21,125.705,150.905,81.657,79.192z"/>
                        <path class="flame-main three" fill="#FDBA16" d="M99.92,101.754c0,0-23.208,47.027-12.043,80.072c0,0,32.741-16.073,20.108-45.79
                          C95.354,106.319,99.92,114.108,99.92,101.754z"/>
                        <path class="flame-main four" fill="#F36E21" d="M103.143,105.917c0,0,8.927,30.753-1.043,46.868c-9.969,16.115-14.799,29.041-14.799,29.041
                          S134.387,164.603,103.143,105.917z"/>
                        <path class="flame-main five" fill="#FDBA16" d="M62.049,104.171c0,0-15.645,67.588,10.529,77.655C98.753,191.894,69.033,130.761,62.049,104.171z"/>
                        <path class="flame" fill="#F36E21" d="M101.011,112.926c0,0,8.973,10.519,4.556,16.543C99.37,129.735,106.752,117.406,101.011,112.926z"/>
                        <path class="flame one" fill="#F36E21" d="M55.592,126.854c0,0-3.819,13.29,2.699,16.945C64.038,141.48,55.907,132.263,55.592,126.854z"/>
                        <path class="flame two" fill="#F36E21" d="M54.918,104.595c0,0-3.959,6.109-1.24,8.949C56.93,113.256,52.228,107.329,54.918,104.595z"/>
                      </svg>
                    </div>
                  card_mod:
                    style: |
                      ha-card {
                        border-width: 0;
                        box-shadow: none;
                        backdrop-filter: none !important;
                      }
                      @media screen and (max-width: 1200px) {
                        ha-card {
                          display: none; /* hide in last row, so it doesn't create an extra column on the right */
                        }
                      }
                      ha-card $ div div: >
                        .mo-fire {
                          width: 100%;
                          height: auto;
                        }
                        .mo-fire svg {
                          width: 100%;
                          height: auto;
                        }
                        .flame {
                          animation-name: flamefly;
                          animation-duration: 2s;
                          animation-timing-function: linear;
                          animation-iteration-count: infinite;
                          opacity: 0;
                          transform-origin: 50% 50% 0;
                        }
                        .flame.one {
                          animation-delay: 1s;
                          animation-duration: 3s;
                        }
                        .flame3.two{
                          animation-duration: 5s;
                          animation-delay: 1s;
                        }

                        .flame-main {
                          animation-name: flameWobble;
                          animation-duration: 3s;
                          animation-timing-function: linear;
                          animation-iteration-count: infinite;
                        }
                        .flame-main.one {
                          animation-duration: 4s;
                          animation-delay: 1s;
                        }
                        .flame-main.two {
                          animation-duration: 3s;
                          animation-delay: 2s;
                        }
                        .flame-main.three {
                          animation-duration: 2.1s;
                          animation-delay: 3s;
                        }
                        .flame-main.four {
                          animation-duration: 3.2s;
                          animation-delay: 4s;
                        }
                        .flame-main.five {
                          animation-duration: 2.5s;
                          animation-delay: 5s;
                        }
                        @keyframes flameWobble {
                          50% {
                            transform: scale(1,1.2) translate(0, -30px) rotate(-2deg);
                          }
                        }
                        @keyframes flamefly {
                          0%{
                            transform: translate(0) rotate(180deg);
                          }
                          50% {
                            opacity: 1;
                          }
                          100% {
                            transform: translate(-20px, -100px) rotate(180deg);
                            opacity: 0;
                          }

                - type: custom:button-card
                  name: "Fire Alarm"
                  template: base
                  view_layout:
                    grid-area: on_off_button
                  aspect_ratio: 1/1
                  entity: alarm_control_panel.fire_alarm
                  triggers_update:
                    - alarm_control_panel.fire_alarm
                    - sensor.fire_status
                  label: >-
                    [[[
                        const id = states['sensor.fire_status']; 
                        return id?.state ? id.state : '';
                        // workaround not updating https://github.com/thomasloven/hass-browser_mod/issues/981
                        //let template = "[[[ const id = states['sensor.fire_status']; return id?.state ? id.state : ''; ]]]";
                        //return template;
                    ]]]
                  show_label: true
                  tap_action:
                    action: call-service
                    service: script.toggle_fire_alarm
                  styles:
                    grid:
                      - align-items: start #
                      - grid-template-areas: |
                          "n"
                          "."
                          "s"
                          "."
                          "l"
                      - grid-template-columns: 1fr
                      - grid-template-rows: min-content 1vw min-content 1vw min-content

                    name:
                      - justify-self: start # align to the left in the grid area
                      - line-height: 121%
                      - font-size: 30px
                    state:
                      - justify-self: start
                      - line-height: 115%
                      - font-size: 20px
                    label:
                      - justify-self: start
                      - line-height: 115%
                      - font-size: 20px

                - type: custom:layout-card
                  layout_type: custom:grid-layout
                  layout:
                    grid-gap: 2vw
                    grid-template-columns: repeat(1, 1fr)
                  view_layout:
                    grid-area: smoke_detectors
                  cards:
                    - type: custom:auto-entities
                      show_empty: false
                      filter:
                        include:
                          - domain: binary_sensor
                            entity_id: /nest_protect_.*_status/
                            state: "on"
                            options:
                              icon: mdi:fire
                              type: custom:multiple-entity-row
                              show_state: true
                              secondary_info: last-changed

    background:
      opacity: 100
      alignment: center
      size: cover
      repeat: repeat
      attachment: fixed
      image: /api/image/serve/33e5f7514c86d628e8141caada05bc6f/original

    theme: Frosted Glass Dashboard Theme
    path: Default
