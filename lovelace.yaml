                  line-height: 30px;                  
                  font-weight: 400;
                }

          - name: "Air Quality"
            type: custom:mini-graph-card
            entities:
              - entity: sensor.los_altos_country_club_aqi
            hour24: true
            hours_to_show: 720
            icon: mdi:dots-vertical
            line_width: 5
            lower_bound: 0
            show:
              icon: true
              icon_adaptive_color: true
            smoothing: false
            upper_bound: 250
            color_thresholds:
              - color: "#68e143"
                value: 0
              - color: "#ffff55"
                value: 50
              - color: "#ef8533"
                value: 100
              - color: "#ea3324"
                value: 150
              - color: "#8c1a4b"
                value: 200
              - color: "#731425"
                value: 300
            card_mod:
              style: |
