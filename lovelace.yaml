                    type: entities
                    card_mod:
                      style: |
                        ha-card {
                          background: linear-gradient(to right, rgba(76, 217, 100, 0.2), rgba(76, 217, 100, 0.1));
                        }
                    entities:
                      - entity: sensor.los_altos_country_club_temperature
                        name: Air temp
                      - entity: sensor.los_altos_country_club_humidity
                        icon: mdi:water-percent
                        name: Humidity
                      - entity: sensor.los_altos_country_club_pressure
                        icon: mdi:arrow-collapse-down
                        name: Air pressure
                      - entity: sensor.los_altos_country_club_pm1
                        icon: mdi:waves
                        name: Particles ≤ 1 µm
                      - entity: sensor.los_altos_country_club_pm2_5
                        icon: mdi:waves
                        name: Particles ≤ 2.5 µm
                      - entity: sensor.los_altos_country_club_pm10
                        icon: mdi:waves
                        name: Particles ≤ 10 µm

          - name: "Backyard temp"
            type: custom:mini-graph-card
            group_by: date
            hour24: true
            hours_to_show: 730
            lower_bound: 32
            upper_bound: 100
            smoothing: false
            show:
              icon: true
              icon_adaptive_color: true
              legend: false
            entities:
              - aggregate_func: max
                entity: sensor.opnpool_last_air_temp
                name: max temp
              - aggregate_func: min
                entity: sensor.opnpool_last_air_temp
                name: min temp
            card_mod:
              style: |
                ha-card {
                  background: rgba(0,0,0, 0.3);
                }

