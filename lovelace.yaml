# A few words to the wise ..
#  - Use the Visual Code addon in Home Assistant, and embrase the folding editor.
#  - However tempting, I didn't split up this file, because it caused problems
#    with !include files staying cached.
#  - Use the browser_mod UI to hide the header
#  - Some credentials must reside in secrets.yaml what is not included in this
#    repository
#  - Remember, browser_mod can be used to print values on the console of the
#    browser.
#  - Many thanks to Mattias Persson for sharing his work.  It gave me a head
#    start in configuring this Dashboard

wallpanel:
  enabled: false
  hide_toolbar: true
  hide_sidebar: true
  fullscreen: true
  idle_time: 600
  screensaver_entity: input_boolean.panel_screensaver # switch created in UI
  profiles:
    device.browser_mod_panel_m11:
      enabled: true
      views: []
      fullscreen: true
      hide_toolbar: true
      hide_sidebar: true
      cards:
        - entity: weather.pirateweather
          type: custom:weather-chart-card
    device.browser_mod_panel_m11_2:
      enabled: true
      views: []
      hide_toolbar: true
      hide_sidebar: true
      fullscreen: true
      cards:
        - entity: weather.pirateweather
          type: custom:weather-chart-card

button_card_templates:
  settings:
    variables:
      tilt_enable: true

  base: # --------------------------------------------------------------------
    template:
      - settings
      - tilt
    variables:
      state_on: >
        [[[ return ['on', 'home', 'cool', 'heat', 'fan_only', 'playing',
        'unlocked', 'armed_home', 'armed_away', 'armed_night',
        'open', 'manual', 'program'].indexOf(!entity || entity.state) !== -1; ]]]
      state: >
        [[[ return !entity || entity.state; ]]]
      entity_id: >
        [[[ return !entity || entity.entity_id; ]]]
      entity_picture: >
        [[[ return !entity || entity.attributes.entity_picture; ]]]
      timeout: >
        [[[ return !entity || Date.now() - Date.parse(entity.last_changed); ]]]
      is_youtube: >
        [[[
          let is_youtube = entity?.attributes?.app_id === 'com.google.ios.youtube',
              sensor = this?._config?.triggers_update,
              media_title = entity?.attributes?.media_title,
              watching_title = states[sensor]?.attributes?.title;
          if (is_youtube && media_title === watching_title) {
              return true;
          }
        ]]]
    aspect_ratio: 1/1
    show_state: true
    show_icon: true
    state_display: >
      [[[
        if (variables.state === true) return 'Unknown';
        return variables.state;
      ]]]
    tap_action:
      #ui_sound_tablet: |
      #  [[[
      #    let screensaver = states['switch.galaxy_tab_a_screensaver'] === undefined ||
      #        states['switch.galaxy_tab_a_screensaver'].state;
      #
      #    if (variables.state === 'off' && screensaver === 'off') {
      #        hass.callService('media_player', 'play_media', {
      #            entity_id: 'media_player.tablet',
      #            media_content_id: '/local/sound/on.m4a',
      #            media_content_type: 'music'
      #        });
      #    }
      #    if (variables.state_on && screensaver === 'off') {
      #        hass.callService('media_player', 'play_media', {
      #            entity_id: 'media_player.tablet',
      #            media_content_id: '/local/sound/off.m4a',
      #            media_content_type: 'music'
      #        });
      #    }
      #  ]]]
      card_bounce: |
        [[[
          // add animation
          if (this.getElementsByTagName("style").length === 0) {

              // phone condition
              let mq = window.matchMedia('(max-width: 800px)').matches;

              let style = document.createElement('style');

              style.innerHTML = `
                  @keyframes card_bounce {
                      0%   { transform: scale(1); }
                      10%  { transform: scale(${ mq ? '0.92' : '0.94' }); }
                      25%  { transform: scale(1); }
                      30%  { transform: scale(${ mq ? '0.96' : '0.98' }); }
                      100% { transform: scale(1); }
                  }
              `;

              this.appendChild(style);
          }
          let duration = 800;
          this.style.animation = `card_bounce ${duration}ms cubic-bezier(0.22, 1, 0.36, 1)`;
          window.setTimeout(() => { this.style.animation = "none"; }, duration + 100)
        ]]]
      action: toggle
      haptic: medium
    double_tap_action:
      haptic: success
    hold_action:
      action: block
    state:
      - value: "unavailable"
        styles:
          card:
            - opacity: 45%
        tap_action:
          action: none
      #- value: "off"
      #  styles:
      #    icon:
      #      - color: rgb(215,215,215)
      - value: "closed"
        styles:
          icon:
            - color: rgb(215,215,215)
      - value: "paused"
        styles:
          icon:
            - color: rgb(215,215,215)
    styles:
      grid:
        - grid-template-areas: |
            "i  circle"
            "n     n"
            "s     s"
        - grid-template-columns: repeat(2, 1fr)
        - grid-template-rows: auto repeat(2, min-content)
        - gap: 1.3%
        - align-items: start
        - will-change: transform
      name:
        - justify-self: start
        - line-height: 121%
      state:
        - justify-self: start
        - line-height: 115%
        - font-size: 13px
      icon:
        - color: var(--button-card-light-color)
        - icon_size: 600px
        - padding: 0px 0px
        - margin-top: "-45%"
        - margin-left: "-28%"
        - width: "80%"
      card:
        - border-radius: var(--button-card-border-radius)
        - border-width: 0
        - -webkit-tap-highlight-color: rgba(0,0,0,0)
        - transition: none
        - --mdc-ripple-color: >-
            [[[
              return variables.state_on
                  ? 'rgb(0, 0, 0)'
                  : '#97989c';
            ]]]
        - color: >-
            [[[
              return variables.state_on
                  ? '#4b5254'
                  : '#97989c';
            ]]]
        - background-color: >-
            [[[
              return variables.state_on
                  ? 'rgba(255, 255, 255, 0.85)'
                  : 'rgba(115, 115, 115, 0.25)';
            ]]]
    extra_styles: |
      #container {
        text-align: left !important;
        z-index: 1;
      }
      #card {
        padding: 10.9% 9.9% 8.9% 10.9%;
      }
      #state::first-letter {
        text-transform: uppercase;
      }
      #name, #state {
        font-size: var(--button-card-font-size);
        font-weight: var(--button-card-font-weight);
        letter-spacing: var(--button-card-letter-spacing);
      }
      @media screen and (max-width: 1200px) { /* portrait */
        #name, #state {
          font-size: calc(var(--button-card-font-size) * var(--card-portrait));
        }
      }
      @media screen and (max-width: 800px) { /* phone */
        #name, #state {
          font-size: calc(var(--button-card-font-size) * var(--card-phone));
        }
      }

  light: # -------------------------------------------------------------------
    template:
      - base
      - circle
      - loader
    double_tap_action:
      action: fire-dom-event
      browser_mod:
        service: browser_mod.popup
        data:
          title: >
            [[[
              return !entity || entity.attributes.friendly_name;
            ]]]
          card_mod:
            style:
              #popup header
              .:
          content:
            type: entities
            card_mod:
              style: |
                #states {
                  padding-top: 0.5em;
                }
            entities: >
              [[[
                if (entity) {
                    let lights = [],
                        id = Boolean(entity.attributes.entity_id)
                            ? [entity.entity_id].concat(entity.attributes.entity_id)
                            : [entity.entity_id];

                    for (let ii = 0; ii < id.length; ii++) {
                        lights.push({
                            "type": "custom:mushroom-light-card",
                            "entity": id[ii],
                            "fill_container": false,
                            "primary_info": "name",
                            "secondary_info": "state",
                            "icon_type": "icon",
                            "show_brightness_control": true,
                            "use_light_color": true,
                            "show_color_temp_control": true,
                            "show_color_control": true,
                            "collapsible_controls": true
                        });
                    }
                    return lights;
                }
              ]]]
    variables:
      circle_input: >
        [[[
          if (entity) {
              // if light group get brightness from child to remove bounce
              let child = entity.attributes.entity_id,
                  brightness = child && states[child[0]].attributes.brightness
                      ? Math.round(states[child[0]].attributes.brightness / 2.54)
                      : Math.round(entity.attributes.brightness / 2.54);
              return brightness === 0 && entity.state !== 'off'
                  ? 1
                  : brightness
          }
        ]]]
      circle_input_unit: "%"
    extra_styles: >
      [[[
        if (entity) {  // set light color
            if (entity.entity_id.split('.')[0] === 'light' && variables.state_on) {

                // theme variable and conditions
                let style = getComputedStyle(document.body),
                    theme_var = style.getPropertyValue('--button-card-light-color-temp'),
                    is_hsl = theme_var.startsWith('hsl('),
                    is_color_temp = entity.attributes.color_mode === 'color_temp';

                if (is_hsl && is_color_temp && entity.attributes.brightness) {

                    // calculate lightness in hsl
                    let regex_pattern = /(\d+)(?!.*\d)/g,
                        brightness = entity.attributes.brightness / 2.54,
                        lightness = parseFloat(theme_var.match(regex_pattern)[0]),
                        min = lightness - 10,
                        max = lightness + 10,
                        calc_lightness = brightness * (max - min) / 100 + min;

                    var light_color = theme_var.replace(regex_pattern, calc_lightness);
                }
                else {
                    var light_color = 'var(--button-card-light-color)';
                }
            }
        }

        return `
            svg {
              --light-color: ${
                variables.state_on && entity.attributes.brightness
                    ? light_color
                    : variables.state_on && !entity.attributes.brightness
                        ? 'var(--state-icon-active-color);'
                        : 'var(--state-icon-color);' }
            }
            .light-color {
              fill: var(--light-color);
              transition: all 0.25s ease-out;
            }
            :host { /* magnification */
              --card-portrait: 1.4;
              --card-phone: 2.271;
            }

            #circle_slider {
              opacity: 0;
              appearance: none;
              transform: rotate(270deg);
              width: 90%;
              position: absolute;
              pointer-events: none;
              cursor: grab;
              left: 26%;
              margin-top: 13%;
            }
            #circle_slider::-webkit-slider-thumb {
              pointer-events: initial;
              appearance: none;
              width: 3vw;
              height: 3vw;
              border-radius: 50%;
              background: green;
            }
            #circle_slider::-webkit-slider-runnable-track {
              background: cornflowerblue;
            }
            #circle_slider::-moz-range-thumb {
              pointer-events: initial;
              appearance: none;
              width: 3vw;
              height: 3vw;
              border-radius: 50%;
              background: green;
            }
            #circle_slider::-moz-range-track {
              background: cornflowerblue;
              height: 3vw;
            }
            @media screen and (max-width: 1200px) { /* portrait */
              #circle_slider::-webkit-slider-thumb {
                width: 4vw;
                height: 4vw;
              }
              #circle_slider::-moz-range-thumb {
                width: 4vw;
                height: 4vw;
              }
            }
            @media screen and (max-width: 800px) { /* phone */
              #circle_slider::-webkit-slider-thumb {
                width: 5.8vw;
                height: 5.8vw;
              }
              #circle_slider::-moz-range-thumb {
                width: 5.8vw;
                height: 5.8vw;
              }
            }`;
      ]]]

  circle: # ------------------------------------------------------------------
    styles:
      card:
        - --c-stroke-color-on: "#b0b0b0"
        - --c-stroke-color-off: none
        - --c-fill-color-on: none
        - --c-fill-color-off: rgba(255,255,255,0.04)
        - --c-stroke-width: 2.3
        - --c-stroke-width-dragging: 4
        - --c-font-color: "#97989c"
        - --c-font-size: 14px
        - --c-unit-font-size: 10.5px
        - --c-font-weight: 700
        - --c-letter-spacing: -0.02rem
      custom_fields:
        circle:
          - display: initial
          - width: 88%
          - margin: -3% 2% 0 0
          - justify-self: end
          - opacity: 1
    custom_fields:
      circle: >
        [[[
          if (entity) {
              let r = 22.1,
                  c = r * 2 * Math.PI,
                  tspan = '<tspan dx=".2" dy="-.4">',
                  domain = entity.entity_id.split('.')[0],
                  state = variables.state_on,
                  input = variables.circle_input || ' ',
                  unit = variables.circle_input_unit || ' ';

            /* * * * * * * * * * * * * * * * * *
              *                                 *
              *             CIRCLE              *
              *                                 *
              * * * * * * * * * * * * * * * * * */

              let circle = (state, input, unit) => {
                  return `
                    <svg viewBox="0 0 50 50">
                      <style>
                        circle {
                          transform: rotate(-90deg);
                          transform-origin: 50% 50%;
                          stroke-dasharray: ${c};
                          stroke-dashoffset: ${typeof input === 'number' && c - input / 100 * c};
                          stroke-width: var(--c-stroke-width);
                          stroke: ${state ? 'var(--c-stroke-color-on)' : 'var(--c-stroke-color-off)'};
                          fill: ${state ? 'var(--c-fill-color-on)' : 'var(--c-fill-color-off)'};
                        }
                        text {
                          font-size: var(--c-font-size);
                          font-weight: var(--c-font-weight);
                          letter-spacing: var(--c-letter-spacing);
                          fill: var(--c-font-color);
                        }
                        tspan {
                          font-size: var(--c-unit-font-size);
                        }
                        #circle_value, tspan {
                          text-anchor: middle;
                          dominant-baseline: central;
                        }
                      </style>
                      <circle id="circle_stroke" cx="25" cy="25" r="${r}"/>
                      <text id="circle_value" x="50%" y="52%">${input}${tspan}${unit}</tspan></text>
                    </svg>

                    ${domain === 'light' && `
                        <input id="circle_slider" type="range" min="0" max="100" value="${input}">
                    `}
                  `;
              }

            /* * * * * * * * * * * * * * * * * *
              *                                 *
              *              LIGHT              *
              *                                 *
              * * * * * * * * * * * * * * * * * */

              if (domain === 'light' && state) {

                  // wait 0ms for shadow dom
                  setTimeout(() => {

                      // then get elements
                      let elt = this.shadowRoot,
                          circle_slider = elt.getElementById('circle_slider'),
                          circle_value = elt.getElementById('circle_value'),
                          circle_stroke = elt.getElementById('circle_stroke');

                      // approximate position of thumb relative to circle
                      circle_slider.style.top = `${(circle_slider.value - 50) / 1.66 - 1}%`;

                      // debug position
                      let debug = false;
                      if (debug) circle_slider.style.opacity = 0.3;

                      // pass each event to handler
                      ['click', 'input', 'mousedown', 'mouseup', 'touchstart', 'touchend'].forEach((event) => {
                          circle_slider.addEventListener(event, handler, { passive: true })
                      });

                      function handler(event) {

                          // "this" refers to slider
                          if (event.target === this) {

                              // bypass button-card tap_action
                              event.stopPropagation();

                              // update circle_value
                              circle_value.innerHTML = `${this.value}${tspan}${unit}</tspan>`;

                              // update stroke
                              circle_stroke.style.strokeDashoffset = c - this.value / 100 * c;
                              circle_stroke.style.strokeWidth = 'var(--c-stroke-width-dragging)';
                              
                              // set cursor while dragging
                              if (event.type === 'mousedown' || event.type === 'input') {
                                  this.style.cursor = 'grabbing';
                              } else {
                                  this.style.cursor = 'grab';
                              }

                              // reset stroke width if value doesn't change
                              if (input == this.value && (event.type === 'click' || event.type === 'touchend'))
                                  circle_stroke.style.strokeWidth = 'var(--c-stroke-width)';

                              // on release
                              if (event.type === 'mouseup' || event.type === 'touchend') {

                                  // display loader if brightness is 0
                                  if (circle_slider.value == 0 && elt.getElementById('loader')) {
                                      elt.getElementById('loader').style.display = 'initial';
                                      elt.getElementById('circle').style.display = 'none';
                                  }

                                  // set brightness
                                  hass.callService('light', 'turn_on', {
                                      entity_id: entity.entity_id,
                                      brightness_pct: this.value
                                  });
                              }
                          }
                      }
                  }, 0);

                  return circle(state, input, unit);
              }

            /* * * * * * * * * * * * * * * * * *
              *                                 *
              *             PERSON              *
              *                                 *
              * * * * * * * * * * * * * * * * * */

              else if (domain === 'person') {
                  let time = c => {
                      let s = (c/1e3),
                          m = (c/6e4),
                          h = (c/36e5),
                          d = (c/864e5);
                      return s < 60
                          ? parseInt(s) + 's'
                          : m < 60 ? parseInt(m) + 'm'
                          : h < 24 ? parseInt(h) + 'h'
                          : parseInt(d) + 'd';
                  };
                  let input = states[variables.retain] === undefined || states[variables.retain].state === 'unavailable'
                          ? time(Date.now() - Date.parse(entity.last_changed))
                          : time(Date.now() - Date.parse(states[variables.retain].state)),
                      unit = ' ';
                  return circle(state, input, unit);
              }

            /* * * * * * * * * * * * * * * * * *
              *                                 *
              *             CLIMATE             *
              *                                 *
              * * * * * * * * * * * * * * * * * */

              else if (domain === 'climate') {
                  return circle(state, input, unit);
              }

            /* * * * * * * * * * * * * * * * * *
              *                                 *
              *              OTHER              *
              *                                 *
              * * * * * * * * * * * * * * * * * */

              else if (variables.state_on) {
                  return circle(state, input, unit);
              }
          }
        ]]]
  circle_graph: # ------------------------------------------------------------
    template:
      - base
    variables: graph_color
    size: 80%
    show_state: true
    aspect_ratio: 1/1
    icon: mdi:pool-thermometer
    custom_fields:
      circle:
        card:
          type: custom:mini-graph-card
          entities:
            - "[[[ return entity.entity_id ]]]"
          show:
            icon: false
            name: false
            state: false
            fill: false
          card_mod:
            style: |
              ha-card {
                box-shadow: none;
                background: none;
                backdrop-filter: none !important;
                border-radius: 0px;
              }
    styles:
      icon:
        - color: rgb(157, 160, 162)
    card_mod:
      style: |
        ha-card {
          box-shadow: none;
          background: none;
          backdrop-filter: none !important
        }

  loader: # ------------------------------------------------------------------
    custom_fields:
      loader: >
        <img src="/local/loader.svg" width="100%">
    tap_action:
      loader: >
        [[[
          if (entity) {
              let elt = this.shadowRoot,
                  loader = (id, style, timeout) => {
                    elt.getElementById(id) && (elt.getElementById(id).style.display = style,
                      window.setTimeout(() => {
                        elt.getElementById('loader').style.display = 'none'
                      }, 20000))
                  };
              loader('circle', 'none', 'initial'),
              loader('loader', 'initial', 'none');
          }
        ]]]
    styles:
      custom_fields:
        loader:
          - display: none
          - top: -6%
          - right: -3.5%
          - width: 52%
          - position: absolute
          - opacity: 0.5
          - pointer-events: none
          - filter: >
              [[[
                return variables.state_on
                    ? 'none'
                    : 'invert(1)';
              ]]]

  pool_circuit: # ------------------------------------------------------------
    template:
      - base
      - loader
    variables: schedule_entity
      pending_entity
      loader_script_entity
    size: 80%
    show_state: true
    aspect_ratio: 1/1
    state:
      - value: "on"
        styles:
          icon:
            - color: cornflowerblue
    state_display: |
      [[[
        let sched = states[variables.schedule_entity];
        if (sched && sched.state) {
            return sched.state;
        }
        return entity.state
      ]]]
    triggers_update: all
    tap_action:
      action: call-service
      service: |
        [[[
          /* script was created using blueprint Toggle switch_entity, with support for spinner */
          return variables.loader_script_entity;
        ]]]
      #service: script.toggle_opnpool_aux2_circuit_with_support_for_spinner # created using blueprint 'Toggle switch_entity, with support for spinner'
    styles:
      custom_fields:
        loader:
          - display: |
              [[[
                if (states[variables.pending_entity].state === 'on') {
                  return "initial";
                } else {
                  return "none";
                }
              ]]]
  pool_component: # ----------------------------------------------------------
    template:
      - base
      - read_only
    variables: info1_entity
      info2_entity
      status_entity
    size: 80%
    show_state: true
    aspect_ratio: 1/1
    state:
      - value: "on"
        styles:
          icon:
            - color: cornflowerblue
    styles:
      state:
        - font-size: 13px
    state_display: |
      [[[
        if (entity && entity.state == 'on') {
            let status = states[variables.status_entity];

            if (status && status.state) {
                if (status.state === 'OK') {
                    let info = '';
                    let info1 = states[variables.info1_entity];
                    let info2 = states[variables.info2_entity];
                    if (info1 && info1.state) {
                        info = info1.state.toLowerCase();
                        if (info1.attributes.unit_of_measurement) {
                            info = info + info1.attributes.unit_of_measurement;
                        }
                        info = info.charAt(0).toUpperCase() + info.slice(1) + ', ';
                    }
                    if (info2 && info2.state) {
                        info = info + info2.state + ' ';
                        if (info2.attributes.unit_of_measurement) {
                            info = info + ' ' + info2.attributes.unit_of_measurement;
                        }

                    }
                    if (info.length > 0) {
                        return info;
                    }
                } else {
                    return status.state.charAt(0).toUpperCase() + status.state.slice(1).toLowerCase();
                }
            }
        }
        return entity.state
      ]]]

  irrigation_program: # ------------------------------------------------------
    template:
      - base
    variables: start_time_entity
    icon: mdi:auto-mode
    size: 80%
    show_state: true
    aspect_ratio: 1/1
    state_display: |
      [[[
        if (entity?.state == 'on') {
            let start_id = states[variables.start_time_entity];
            return "At " + start_id?.state.slice(0, 5);
        }
        return entity.state;
      ]]]
  irrigation_zone: # ---------------------------------------------------------
    triggers_update: all
    template:
      - base
      - circle
      - loader
    variables:
      state_on: >
        [[[ return ['manual', 'program'].indexOf(!entity || entity.state) !== -1; ]]]
      circle_input: >
        [[[ 
            let value = states['sensor.sprinklerlawn1_station_status'];  // 2BD fix this
            if (!value) return 10;
            if (!value.attributes.end_time) return 15;
            if (value.attributes.end_time === undefined) return 30;

            const total_time = (Date.parse(value.attributes.end_time) - Date.parse(value.attributes.start_time)) / 1000;
            const elapsed_time = (Date.now() - Date.parse(value.attributes.start_time)) / 1000;
            const remaining_time = total_time - elapsed_time;

            return remaining_time > 0 ? Math.min(100, Math.round(remaining_time / total_time * 100)) : 0;
        ]]]
      circle_input_unit: "%"
    icon: mdi:water
    size: 80%
    show_state: true
    aspect_ratio: 1/1
    state:
      - value: "manual"
        styles:
          icon:
            - color: cornflowerblue
      - value: "program"
        styles:
          icon:
            - color: cornflowerblue
    tap_action:
      action: call-service
      service: >-
        [[[ return (entity && entity.state === 'idle') ? 'opensprinkler.run_station' : 'opensprinkler.stop'; ]]]
      target:
        entity_id: >-
          [[[ return entity.entity_id; ]]]

  footer: #-------------------------------------------------------------------
    template:
      - settings
      - tilt
    variables:
      active_id: null
      notify: >-
        [[[
            return false;
        ]]]
      tilt_options: >
        [[[
          return {
            max: 5,
            scale: 1.1,
            glare: true,
            'max-glare': 0.07,
            perspective: 1000,
            speed: 800,
            parallax: '10px'
          };
        ]]]
    size: 2vw
    show_icon: false
    show_state: true
    color: "#9da0a2"
    custom_fields:
      notify: >-
        [[[
            if (Number.isInteger(variables.notify)) {
                return variables.notify;
            } else if (variables.notify) {
                return `<span style="font-weight: 900;">!</span>`;
            }
        ]]]
    styles:
      grid:
        - grid-template-areas: |
            "n"
            "s"
        - grid-template-columns: 1fr
        - grid-template-rows: repeat("2", 1fr)
        - gap: 1.3%
          align-items: center # vertically center cards in their grid cells
      name:
        - justify-self: center
        - line-height: 121%
        - font-size: 20px
      state:
        - justify-self: center
        - line-height: 115%
        - font-size: 13px
      card:
        - padding: 0
        - border-radius: 1vw 1vw 0 0
        - border: 0.12vw solid rgba(115, 115, 115, 0.2)
        - -webkit-tap-highlight-color: rgba(0,0,0,0)
        - transition: none
        - overflow: visible
        - --mdc-ripple-color: >
            [[[
              return variables.state_on
                  ? 'rgb(0, 0, 0)'
                  : '#97989c';
            ]]]
        - color: >
            [[[
                let active = states[variables.active_id];
                if (active) {
                    return parseInt(active.state) > 0
                        ? '#4b5254'
                        : '#97989c';
                }
                return 'black';
            ]]]
        - background-color: >
            [[[
                let active = states[variables.active_id];
                if (active) {
                    return parseInt(active.state) > 0
                        ? 'rgba(255, 255, 255, 0.85)'
                        : 'rgba(115, 115, 115, 0.25)';
                }
                return 'grey';
            ]]]
      custom_fields:
        notify:
          - display: >
              [[[
                if (Number.isInteger(variables.notify)) {
                    return variables.notify > 0 ? 'initial' : 'none';
                }
                else if (variables.notify) {
                    return variables.notify ? 'initial' : 'none';
                }
              ]]]
          - position: absolute
          - font-weight: 700
          - color: "#d6d6d6"
          - background: "#8b3333"
          - border-radius: 50%
          - text-align: center
          - text-overflow: unset
          - z-index: 1
    extra_styles: |
      :host { /* magnification */
        --footer-portrait: 1.4;
        --footer-phone: 2.8;
      }
      #ripple, .js-tilt-glare {
        border-radius: calc(var(--footer-card-border-radius) - 0.1vw);
        clip-path: inset(0 round calc( var(--button-card-border-radius) - 0.1vw ));
      }
      #name, #state {
        font-size: var(--footer-card-font-size);
        #padding: var(--footer-card-padding-v) var(--footer-card-padding-h);
        padding: 0 var(--footer-card-padding-h);
        letter-spacing: 0.05vw;
      }
      ha-icon {
        width: var(--footer-card-icon-size);
        vertical-align: 7%;
        padding-right: 0.1vw;
        opacity: 0.4;
      }
      #card {
        border-radius: var(--footer-card-border-radius);
        background: rgba(115, 115, 115, 0.10);
      }
      #notify {
        font-size: var(--footer-notify-font-size);
        width: var(--footer-notify-box-size);
        height: var(--footer-notify-box-size);
        line-height: var(--footer-notify-box-size);
        padding-right: 0.5%;
        padding-top: 0.5%;
        top: var(--footer-notify-top);
        right: var(--footer-notify-right);
      }              
      @media screen and (max-width: 1200px) { /* portrait */
      }
      @media screen and (max-width: 800px) { /* phone */
      }
    tap_action:
      haptic: medium
    hold_action:
      action: block
    double_tap_action:
      action: block

  obsolete_sidebar: # -----------------------------------------------------------------
    show_state: false
    show_icon: false
    tap_action:
      action: none
    name: >
      [[[
        if (entity) {
          let attr = [];
          for (let [k, value] of Object.entries(entity.attributes))
              window.navigator.userAgent.match(/iPhone/i)
                  ? k !== 'time' && k !== 'date' && k !== 'friendly_name' && value !== false && (attr += `<p>${k === 'greet' ? `<span class="iphone">${value}</span>` : `${value}`}</p>`)
                  : k !== 'friendly_name' && value !== false && (attr += `<p>${value}</p>`);
          return attr;
        }
      ]]]
    card_mod:
      style: |
        ha-card {
          --ha-card-background: none !important;
          --ha-card-box-shadow: none !important;
          --ha-card-backdrop-filter: none !important;
        }
        #root {
          min-height: 0vh !important;
        }
    extra_styles: >
      #card {
        padding: 0;
        border-width: 0;
        font-family: SF Pro Display, Roboto, system-ui;
      }
      #container {
        //display: flex !important;
      }
      #name {
        //padding: 1vw 2.5vw 0 var(--custom-layout-card-padding);
        white-space: normal;
        text-align: center;
      }
      .phone {
        font-size: 1.5em;
        color: rgba(255, 255, 255, 0.8);
      }
      .time {
        font-size: var(--sidebar-time-font-size);
        font-weight: 300;
        line-height: var(--sidebar-time-line-height);
        letter-spacing: 0.11vw;
        //margin-left: -0.4vw;
        color: rgba(255, 255, 255, 0.8);
      }
      @supports not (-moz-appearance:none) {
        .time-colon {
          //position: relative;
          top: -.11em;
        }
      }
      p {
        font-size: var(--sidebar-font-size);
        line-height: var(--sidebar-line-height);
        font-weight: 200;
        letter-spacing: 0.07vw;
        color: #6a7377;
      }
      b {
        font-weight: 700;
      }
      p > b {
        color: rgba(255, 255, 255, 0.8);
      }
      /* portrait */
      @media screen and (max-width: 1200px) {
        .time {
          font-size: calc(var(--sidebar-time-font-size) * 1.4 );
          line-height: calc(var(--sidebar-time-line-height) * 1.4 );
        }
        p {
          font-size: calc(var(--sidebar-font-size) * 1.4 );
          line-height: calc(var(--sidebar-line-height) * 1.4 );
        }
      }
      /* phone */
      @media screen and (max-width: 800px) {
        .time {
          font-size: calc(var(--sidebar-time-font-size) * 2.6 );
        }
        p {
          font-size: calc(var(--sidebar-font-size) * 2.6 );
          line-height: calc(var(--sidebar-line-height) * 2.6 );
          letter-spacing: 0.16vw;
        }
        #name {
          padding: 0 0 0 1vw;
        }
      }

  tilt: # see https://micku7zu.github.io/vanilla-tilt.js/ --------------------
    variables:
      tilt_enable: >
        [[[
          // disable on macos app, text appears over popup
          //if (window.navigator.userAgent.includes("Home Assistant")) {
          //    return false
          //}

          // enable on desktop/laptop browsers
          if (window.navigator.userAgent.match(/Macintosh/i) ||
              window.navigator.userAgent.match(/Chrome/i) ||
              window.navigator.userAgent.match(/Firefox/i)) {
              return true;
          }
          
          return false;  // default - phones, tablets etc
        ]]]
      tilt_options: >
        [[[
          let options = {
              max: 5,
              scale: 1.06,
              glare: true,
              'max-glare': 0.15,
              perspective: 800,
              speed: 800,
              parallax: '25px'
          }
          if (this._config.template.includes('conditional_media')) {
              options.scale = options.scale % parseInt(options.scale) / 2 + parseInt(options.scale);
              options.perspective = options.perspective * 2;
              return options;
          }
          return options;
        ]]]
    custom_fields:
      tilt: >
        [[[
          setTimeout(() => {
              let elt = this.shadowRoot,
                  card = elt.getElementById('card'),
                  tilt = typeof VanillaTilt === 'function';

              if (elt && card && tilt && variables.tilt_enable) {
                  VanillaTilt.init(card, variables.tilt_options);
              } else {
                  setTimeout(() => {
                      if (elt && card && tilt && variables.tilt_enable) {
                          VanillaTilt.init(card, variables.tilt_options);
                      }
                  }, 1000);
              }
          }, 0);
        ]]]
    extra_styles: |
      #name, #state {
        font-size: calc(var(--button-card-font-size) - var(--z-axis-adjustment));
      }
      @media screen and (max-width: 1200px) { /* portrait */
        #name, #state {
          font-size: calc(calc(var(--button-card-font-size) * var(--card-portrait)) - var(--z-axis-adjustment));
        }
      }
      @media screen and (max-width: 800px) { /* phone */
        #name, #state {
          font-size: calc(calc(var(--button-card-font-size) * var(--card-phone)) - var(--z-axis-adjustment));
        }
      }
      #container {
        transform: translateZ(${variables.tilt_options.parallax});
      }
      #circle_slider {
        width: 100%;
        margin-top: 0;
      }                
      @supports (-moz-appearance:none) { /* adjust circle_slider position for firefox */
        #circle_slider {
          margin-top: 13%;
        }
      }
      #card {
        padding: 12% 11% 10.5% 12%;
        transform-style: preserve-3d;
        overflow: visible;
        /* firefox pixelated edges */
        outline: 1px solid transparent;
      }
      #ripple, .js-tilt-glare {
        clip-path: inset(0 round var(--button-card-border-radius));
        overflow: hidden;
      }
      .js-tilt-glare {
        z-index: 1;
      }
      .js-tilt-glare-inner {
        background-color: rgba(0,0,0,0.9);
      }

