        layout_options:
          place-items: center stretch
          place-content: center center
          padding: 0
          margin: 0vw
          grid-gap: 2vw
          grid-template-columns: repeat(8, 1fr)
          grid-template-rows: repeat(1, min-content)
          mediaquery:
            "(max-width: 800px)":
              grid-template-columns: repeat(2, 1fr)
        view_layout:
          grid-area: footer
        cards:
          - name: "Inside" # -------------------------------------------------
            entity: sensor.inside_temperature
            label: >-
              [[[
                return states['sensor.inside_temperature']?.state;
              ]]]
            type: custom:button-card
            template: footer
            icon: mdi:home-thermometer-outline
            variables:
              active_id: sensor.nr_of_inside_problems
              notify: >-
                [[[
                  let id = states['sensor.nr_of_inside_problems'];
                  if (id) return parseInt(id.state);
                ]]]
            tap_action:
              action: fire-dom-event
              browser_mod:
                service: browser_mod.popup
                data:
                  popup_card_id: inside_popup

          - popup_card_id: inside_popup # ------------------------------------
            type: custom:popup-card
            title: "Inside Climate"
            icon: mdi:home-thermometer-outline
            size: wide # or fullscreen, normal, narrow, etc.
            style: |
              ha-dialog > div.content {
                background-image: linear-gradient(to right, rgba(251, 244, 229, 0.2), rgba(251, 244, 229, 0.1));
              }
              ha-dialog ha-dialog-header {
                background-color: rgba(251, 244, 229, 0.3);
              }                    
            card:
              type: custom:layout-card
              layout_type: custom:grid-layout
              layout:
                place-items: center stretch
                place-content: stretch stretch
                margin: 2vw
                grid-gap: 2vw
                grid-template-columns: repeat(3, 1fr)
                grid-template-rows: repeat(2, min-content)
                grid-template-areas: |
                  "graphic downstairs upstairs"
                  "graphic filter     .       "
                mediaquery:
                  "(max-width: 800px)":
