  #################################################
  #                                               #
  #                INSIDE VIEW                    #
  #                                               #
  #################################################

  - title: "Inside"
    path: inside
    icon: mdi:home-thermometer-outline
    background: linear-gradient(to right, rgba(232, 176, 53, 0.2), rgba(232, 176, 53, 0.1)), url(/local/bg.jpg)

    type: custom:layout-card
    layout_type: grid-layout
    layout:
      margin: 2vw 2vw 0 0 /* when sidebar is hidden, it still uses a cell in the grid */
      padding: 0;
      place-items: stretch stretch
      grid-gap: 2vw
      grid-template-columns: minmax(260px, 20%) 1fr
      grid-template-rows: 1fr 100px  /* leave space for navbar */
      grid-template-areas: |
        "graphic cards"
        ".       .    "
      mediaquery:
        "(max-width: 1200px)":
          grid-template-columns: 0 1fr /* graphic hidden in 0-width column */
    cards:
      #=======
      # NAVBAR
      #=======

      - type: custom:navbar-card
        template: main_menu
        view_layout:
          grid-area: graphic

      #========
      # GRAPHIC
      #========

      - type: custom:button-card
        template: graphic_inside
        view_layout:
          grid-area: graphic

      #======
      # CARDS
      #======

      - type: custom:layout-card
        view_layout:
          grid-area: cards
        layout_type: grid-layout
        layout:
          margin: 0
          padding: 0;
          grid-template-columns: repeat(auto-fit, minmax(300px, 1fr))
          place-items: stretch stretch
          grid-gap: 1vw
        cards:
          - heading: "Main floor"
            type: heading
            heading_style: title
            card_mod:
              style: |
                :host {
                  grid-column: 1 / -1;
                }
                ha-card .content.title p {
                  padding: 0;
                  text-align: var(--ha-stack-title-text-align, start);
                  color: var(--ha-card-header-color, var(--primary-text-color));
                  font-family: var(--ha-card-header-font-family, inherit);  
                  letter-spacing: -0.012em;              
                  font-size: max(2.0vw, 12pt) !important;
                  line-height: 30px;                  
                  font-weight: 400;
                }

          - entity: climate.main_floor
            type: thermostat
            show_current_as_primary: false
            features:
              - type: climate-hvac-modes
            card_mod:
              style: |
                ha-card {
                  background: rgba(0,0,0, 0.3);
                }
                ha-card p.title {
                  display: none;
                }

          - heading: "Upstairs floor"
            type: heading
            heading_style: title
            card_mod:
              style: |
                :host {
                  grid-column: 1 / -1;
                }
                ha-card .content.title p {
                  padding: 0;
                  text-align: var(--ha-stack-title-text-align, start);
                  color: var(--ha-card-header-color, var(--primary-text-color));
                  font-family: var(--ha-card-header-font-family, inherit);  
                  letter-spacing: -0.012em;              
                  font-size: max(2.0vw, 12pt) !important;
                  line-height: 30px;                  
                  font-weight: 400;
                }

          - entity: climate.upstairs_floor
            type: thermostat
            features:
              - type: climate-hvac-modes
            card_mod:
              style: |
                ha-card {
                  background: rgba(0,0,0, 0.3);
                }
                ha-card p.title {
                  display: none;
                }

          - entity: fan.air_filter
            type: custom:purifier-card
            compact_view: false
            show_state: true
            show_toolbar: true
            card_mod:
              style: |
                ha-card {
                  background: rgba(0,0,0, 0.3);
                }
            shortcuts:
              - name: Auto
                icon: mdi:brightness-auto
                preset_mode: auto
              - name: Sleep
                icon: mdi:weather-night
                preset_mode: sleep
              - name: 25%
                icon: mdi:circle-slice-2
                percentage: 25
              - name: 50%
                icon: mdi:circle-slice-4
                percentage: 50
              - name: 75%
                icon: mdi:circle-slice-6
                percentage: 75
              - name: 100%
