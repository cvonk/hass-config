                service: browser_mod.popup
                data:
                  title: "Country Club"
                  card_mod:
                    style:
                      ha-dialog: |
                        ha-dialog-header, .content {
                          background: linear-gradient(to right, rgba(76, 217, 100, 0.2), rgba(76, 217, 100, 0.1));
