- id: '1763962089725'
  alias: Navigate to Fire View on fire_problem
  description: ''
  triggers:
  - trigger: state
    entity_id:
    - binary_sensor.fire_problem
    from:
    - 'off'
    to:
    - 'on'
  conditions: []
  actions:
  - action: system_log.write
    data:
      message: Fire pop-up ..
      level: warning
      logger: fire_automation
  - action: browser_mod.navigate
    metadata: {}
    data:
      path: /lovelace-ui/fire
  - action: browser_mod.popup
    metadata: {}
    data:
      dismissable: true
      autoclose: false
      popup_card_id: lovelace-ui/fire_popup
    enabled: false
  - action: input_boolean.turn_off
    metadata: {}
    data: {}
    target:
      entity_id: input_boolean.panel_screensaver
  mode: single
- id: '1763962512630'
  alias: Notify when inside temperature below 50 °F
  description: ''
  triggers:
  - trigger: numeric_state
    entity_id:
    - sensor.ecobee_main_floor_temperature
    - sensor.ecobee_upstairs_floor_temperature
    below: 50
  conditions: []
  actions:
  - action: notify.all_devices
    metadata: {}
    data:
      message: Inside temperature dropped below 50 °F
  mode: single
- id: '1763962564570'
  alias: Automatically refresh browser on lovelace update
  description: ''
  triggers:
  - trigger: event
    event_type: lovelace_updated
    event_data: {}
  conditions: []
  actions:
  - delay: 00:00:01
  - action: browser_mod.notification
    data:
      message: Lovelace updated
      duration: 1
  mode: single
  max_exceeded: silent
- id: '1766116034025'
  alias: Turn entry light on when somebody comes home after sunset
  description: ''
  triggers:
  - trigger: state
    entity_id:
    - device_tracker.rtr_barrie_phone
    from:
    - not_home
    to:
    - home
  - trigger: state
    entity_id:
    - device_tracker.rtr_coert_phone
    from:
    - not_home
    to:
    - home
  - trigger: state
    entity_id:
    - device_tracker.rtr_sander_phone
    from:
    - not_home
    to:
    - home
  conditions:
  - condition: sun
    before: sunrise
    after: sunset
  actions:
  - action: light.turn_on
    metadata: {}
    target:
      entity_id: light.entry
    data: {}
  - delay:
      hours: 0
      minutes: 3
      seconds: 0
      milliseconds: 0
  - action: light.turn_off
    metadata: {}
    target:
      entity_id: light.entry
    data: {}
  mode: single
