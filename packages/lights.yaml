google_assistant:
  entity_config:
    light.living_room_dimmer:
      name: "Living light"
      room: "Living room"
    switch.sonoff_standing_lamp:
      name: "Standing lamp"
      room: "Living room"
      aliases:
        - "Floor lamp"
    switch.sonoff_reading_light:
      name: "Reading light"
      room: "Living room"
    light.sonoff_christmas_tree:
