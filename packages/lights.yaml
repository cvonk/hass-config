wemo:
  discovery: true

light:
  - platform: decora_wifi # can't be setup through the UI
    username: !secret decora_uname
    password: !secret decora_passwd

  - platform: group
    name: "Outside Group"
    entities:
      - light.porch
      - light.patio
      - light.pool
      #- switch.opnpool_aux2_circuit

  - platform: group
    name: "MBR Group"
    entities:
      - light.master_bedroom_dimmer
      - light.master_bedroom_left
      - light.master_bedroom_right

  - platform: group
    name: "Living Room Group"
    entities:
      - light.living_room_dimmer
      #- switch.sonoff_reading_light
      #- switch.sonoff_floor_lamp

switch:
  - platform: group
    name: "Sander"
    entities:
      - switch.sander_bedroom
      - switch.sander_dresser

template:
  - sensor:
      - unique_id: dining_room_dimmerpwr # purposely use pwr instead of power
        name: "Dining Room Dimmer lightpwr"
        state: >-
          {% set id = 'light.dining_room_dimmer' %}
          {% set value = states(id) %}
          {% set max_power = 5 * 4.0 %}
          {% set brightness = state_attr(id, 'brightness') %}
          {% if value != 'unavailable' and value != 'unknown' %}
          {%     if bool(value) %}
          {{         bool(value) * float(brightness)/255 * max_power }}
          {%     else %}
          {{         0 }}
          {%     endif %}
          {% else %}
          {{     value }}
          {% endif %}

      - unique_id: family_room_dimmerpwr
        name: "Family Room Dimmer lightpwr"
        state: >-
          {% set id = 'light.family_room_dimmer' %}
          {% set value = states(id) %}
