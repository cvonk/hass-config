person:
  - name: "Johan Vonk"
    id: johan_vonk
    device_trackers:
      - device_tracker.rtr_johan_phone

automation lights:
  - alias: "Light on in the evening if anybody is home between 16:00-23:00"
    triggers:
      - trigger: sun
        event: sunset
        offset: "-01:00:00"
      - trigger: state
        entity_id: all
        to: "home"
    conditions:
      - condition: state
        entity_id:
          - person.barrie
          - person.coert
          - person.johan
          - person.sander
        state: "home"
      - condition: time
        after: "16:00:00"
        before: "23:00:00"
    actions:
      - action: homeassistant.turn_on
        target:
          entity_id: light.dining_room_chandelier

  - alias: "Lights off when everybody leaves"
    triggers:
      - trigger: state
        entity_id:
          - person.barrie_levinson
          - person.coert_vonk
          - person.johan_vonk
          - person.sander_vonk
        to: "not_home"
    actions:
      - action: light.turn_off
        target:
          entity_id: all
