automation: # work around ping integration limitation
  - id: update_ping_wan
    alias: "Ping every 3 minutes"
    trigger:
      - trigger: time_pattern
        minutes: "/3"
    condition: []
    mode: single
    action:
      - action: homeassistant.update_entity
        target:
          entity_id:
            - binary_sensor.ping_dns
            - binary_sensor.ping_google

  - id: update_ping_lan
    alias: "Ping every 1 minute"
    trigger:
      - trigger: time_pattern
        minutes: "/1"
    condition: []
    mode: single
    action:
      - action: homeassistant.update_entity
        target:
          entity_id:
            - binary_sensor.ping_rtr
            - binary_sensor.ping_modem
            - binary_sensor.ping_nas
            - binary_sensor.ping_backup
            #- binary_sensor.ping_printer
            - binary_sensor.ping_ap1
            - binary_sensor.ping_ap2
            - binary_sensor.ping_iot_ap1
            - binary_sensor.ping_iot_ap2

template:
  - binary_sensor:
      - unique_id: network_ping_rtr_warning
        name: "Network ping rtr warning"
        icon: mdi:alert
        device_class: problem
        state: >-
          {% set value = states('binary_sensor.ping_rtr') %}
          {% if value != "unavailable" and value != "unknown" %}
          {{    bool(value) == false }}
          {% else %}
          {{     value }}
          {% endif %}

      - unique_id: network_ping_modem_warning
        name: "Network ping modem warning"
        icon: mdi:alert
        device_class: problem
        state: >-
          {% set value = states('binary_sensor.ping_modem') %}
          {% if value != "unavailable" and value != "unknown" %}
          {{    bool(value) == false }}
          {% else %}
          {{     value }}
          {% endif %}

      - unique_id: network_ping_dns_warning
        name: "Network ping DNS warning"
        icon: mdi:alert
        device_class: problem
        state: >-
          {% set value = states('binary_sensor.ping_dns') %}
          {% if value != "unavailable" and value != "unknown" %}
          {{    bool(value) == false }}
          {% else %}
          {{     value }}
          {% endif %}

      - unique_id: network_ping_google_warning
        name: "Network ping Google warning"
        icon: mdi:alert
        device_class: problem
        state: >-
          {% set value = states('binary_sensor.ping_google') %}
          {% if value != "unavailable" and value != "unknown" %}
          {{    bool(value) == false }}
          {% else %}
          {{     value }}
          {% endif %}

      - unique_id: network_ups_warning
        name: "Network UPS warning"
        icon: mdi:alert
        device_class: problem
        state: >-
          {% set value = states('sensor.ups_status') %}
          {% if value != "unavailable" and value != "unknown" %}
          {{    value != 'Online' }}
          {% else %}
          {{     value }}
          {% endif %}

      - unique_id: network_nas_warning
        name: "Network NAS warning"
        icon: mdi:alert
        device_class: problem
        state: >-
          {% set value = states('sensor.nas_volume_1_status') %}
          {% if value != "unavailable" and value != "unknown" %}
          {{    value != 'normal' }}
          {% else %}
          {{     value }}
          {% endif %}

      - unique_id: network_backup_warning
        name: "Network backup warning"
        icon: mdi:alert
        device_class: problem
        state: >-
          {% set value = states('sensor.backup_volume_1_status') %}
          {% if value != "unavailable" and value != "unknown" %}
          {{    value != 'normal' }}
          {% else %}
          {{     value }}
          {% endif %}

      - unique_id: ups_online
        name: "Network UPS online"
        device_class: connectivity
        state: >-
          {% set value = states('sensor.ups_status') %}
          {% if value != "unavailable" and value != "unknown" %}
          {{    value == 'Online' }}
          {% else %}
          {{     value }}
          {% endif %}

      - unique_id: cable_modem_online
        name: "Cable Modem Online"
        device_class: connectivity
        state: >-
          {% set value = states('sensor.cable_modem_connection_status') %}
          {% if value != "unavailable" and value != "unknown" %}
          {{    value == 'online' }}
          {% else %}
          {{     value }}
          {% endif %}

  - sensor:
      - unique_id: nr_of_network_warnings
        name: "Nr of network warnings"
        icon: mdi:alert
        state: >-
          {{
              states.binary_sensor | 
              selectattr('entity_id', 'match', 'binary_sensor\.network_.*_warning') |
              selectattr('state', 'eq', 'on') | list | count
          }}

      - unique_id: cable_modem_mean_s_n
        name: "Cable modem mean S/N"
        icon: mdi:signal
        state: >-
          {% set data_list = states.sensor | 
                  selectattr('entity_id', 'match', 'sensor\.cable_modem_ds_ch_.*_snr') |
                  map(attribute='state') | map('float', 0) | list %}
          {% set sum_list = data_list | sum %}
          {% set count = data_list | length %}
          {% set mean = sum_list / count %}
          {% set ns = namespace(sum_sq_diffs = 0) %}
          {% for item in data_list %}
          {%     set ns.sum_sq_diffs = ns.sum_sq_diffs + (item - mean)**2 %}
          {% endfor %}
          {% set variance = ns.sum_sq_diffs / count %}
          {% set std_dev = variance**0.5 %}
          {{ (mean | round(1) | string) + " dBmV" + ", σ=" + (std_dev | round(1) | string) }}

      - unique_id: cable_modem_worst_freq
        name: "Cable modem worst freq"
        device_class: frequency
        unit_of_measurement: "MHz"
        state: >-
          {% set value_list = states.sensor | 
                selectattr('entity_id', 'match', 'sensor\.cable_modem_ds_ch_.*_uncorrected') |
                map(attribute='state') | map('float', 0) | list %}
          {% set freq_list = states.sensor | 
                selectattr('entity_id', 'match', 'sensor\.cable_modem_ds_ch_.*_frequency') |
                map(attribute='state') | map('float', 0) | list %}
          {% set highest = max(value_list) %}
          {% set idx = value_list.index(highest) %}
          {{ freq_list[idx] / 1000000.0 }}
