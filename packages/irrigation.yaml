template:
  - sensor:
      - unique_id: nr_of_irrigation_valves_active
        name: "Nr of Irrigation Valves Active"
        icon: mdi:sprinkler-variant
        state: |
          {{
            states.binary_sensor | 
            selectattr('entity_id', 'match', 'binary_sensor\..*_station_running') |
            selectattr('state', 'eq', 'on') | list | count | int
          }}
