template:
  - sensor:
      - name: Template Domain Counter
        state: >
          {{ states | count }}
        attributes:
          automation: >
            {{ states.automation | count }}
          binary_sensor: >
            {{ states.binary_sensor | count }}
          device_tracker: >
            {{ states.device_tracker | count }}
          light: >
            {{ states.light | count }}
          media_player: >
            {{ states.media_player | count }}
          sensor: >
            {{ states.sensor | count }}
          switch: >
            {{ states.switch | count }}
          other: >
            {% set exclude = this.attributes | list %}
            {{ states | rejectattr('domain', 'in', exclude) | list | count }}
          inside_climate: >
            {{ states.climate | selectattr('entity_id', 'match', '^climate\..*_floor.*$') | list | count }}

      #- name: Inside Climate Entities
      #  state: >
      #    {{ states.climate | selectattr('entity_id', 'match', '^climate\..*_floor.*$') | map(attribute='entity_id') | list }}
