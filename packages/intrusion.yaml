alarm_control_panel:
  - unique_id: intrusion_alarm
    name: "Intrusion alarm"
    platform: manual
    code_arm_required: false
    trigger_time: 120 # alarm fires for 2 minutes
    disarm_after_trigger: false # stay triggered until manually cleared or times out
    arming_time: 0 # arm immediately
    delay_time: 35 # 35 seconds in 'pending' state until alarm is firing
    disarmed:
      trigger_time: 0

script:
  toggle_intrusion_alarm:
    sequence:
      - action: >-
          {% set value = states('alarm_control_panel.intrusion_alarm')  %}
          {% if value == 'disarmed' %} 
          {{     'alarm_control_panel.alarm_arm_home' }}
          {% else %} 
          {{     'alarm_control_panel.alarm_disarm' }}
          {% endif %}
        metadata: {}
        data: {}
        target:
          entity_id: alarm_control_panel.intrusion_alarm
    alias: "Toggle intrusion alarm"
    description: "Toggle intrusion alarm"

  disarm_intrusion_alarm:
    sequence:
      - action: alarm_control_panel.alarm_disarm
        metadata: {}
        data: {}
        target:
          entity_id: alarm_control_panel.intrusion_alarm
    alias: "Disarm intrusion Alarm"
    description: "Disarm intrusion Alarm"

# sensor.intrusion_status is set in Node Red
