alarm_control_panel:
  - unique_id: fire_alarm
    name: "Fire Alarm"
    platform: manual
    code_arm_required: false
    trigger_time: 120 # alarm fires for 2 minutes
    disarm_after_trigger: false # stay triggered until manually cleared or times out
    arming_time: 0 # arm immediately
    delay_time: 35 # 35 seconds in 'pending' state until alarm is firing
    disarmed:
      trigger_time: 0

script:
  toggle_fire_alarm:
    sequence:
      - action: >-
          {% set value = states('alarm_control_panel.fire_alarm')  %}
          {% if value == 'disarmed' %} 
          {{     'alarm_control_panel.alarm_arm_home' }}
          {% else %} 
          {{     'alarm_control_panel.alarm_disarm' }}
          {% endif %}
        metadata: {}
        data: {}
        target:
          entity_id: alarm_control_panel.fire_alarm
    alias: "Toggle Fire Alarm"
    description: "Toggle Fire Alarm"

  disarm_fire_alarm:
    sequence:
      - action: alarm_control_panel.alarm_disarm
        metadata: {}
        data: {}
        target:
          entity_id: alarm_control_panel.fire_alarm
    alias: "Disarm Fire Alarm"
    description: "Disarm Fire Alarm"

# sensor.fire_status, sensor.intrusion_status are set in Node Red

template:
  - sensor:
      - unique_id: nr_of_fire_alarm_problems
        name: "Nr of Fire Alarm Problems"
        icon: mdi:fire
        state: |
          {{
            states.binary_sensor | 
            selectattr('entity_id', 'match', 'binary_sensor\.nest_protect_.*_status') |
            selectattr('state', 'eq', 'on') | list | count | int
          }}

  - sensor:
      - unique_id: nr_of_intrusion_alarm_problems
        name: "Nr of Intrusion Alarm Problems"
        icon: mdi:police-badge
        state: |
          {% set open_windows = states.binary_sensor | 
                        selectattr('entity_id', 'match', 'binary_sensor\.kc868ai_.*') |
                        rejectattr('entity_id', 'search', '(unused|unknown)') |
                        selectattr('state', 'eq', 'on') | list | count %}
          {% set nest_protect_occupancy = states.binary_sensor | 
                        selectattr('entity_id', 'match', 'binary_sensor\.nest_protect_.*_occupancy') |
                        selectattr('state', 'eq', 'on') | list | count %}
          {% set ecobee_occupancy = states.binary_sensor | 
                        selectattr('entity_id', 'match', 'binary_sensor\.ecobee_.*_occupancy') |
                        selectattr('state', 'eq', 'on') | list | count %}
          {{ open_windows + nest_protect_occupancy + ecobee_occupancy }}

  - sensor:
      - unique_id: nr_of_alarm_problems
        name: "Nr of Alarm Problems"
        icon: mdi:fire
        state: |
          {{
            states('sensor.nr_of_fire_alarm_problems') +
            states('sensor.nr_of_intrusion_alarm_problems')
          }}

google_assistant:
  entity_config:
    script.disarm_fire_alarm:
      expose: true
      name: "Disarm Fire Alarm"
      room: "Home"
