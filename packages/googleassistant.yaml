# when reinstalling, remember to unlink/link the automation from the Google Home App (on phone)
# https://community.home-assistant.io/t/how-to-configure-lets-encrypt-ssl-certificates-for-home-assistant-completely-100-free-updated-for-2022-2023/508329
google_assistant:
  project_id: !secret google_project_id
  service_account: !include service_account.json
  report_state: true # enable “OK Google, sync my devices”
  expose_by_default: false

  exposed_domains:
    - light
    - switch

  entity_config:
    light.christmas_tree:
      name: "Christmas tree"
      room: "Living room"

    # OPNpool
    switch.opnpool_pool_circuit:
      name: "Circuit"
      room: "Pool"
    switch.opnpool_spa_circuit:
      name: "Circuit"
      room: "Pool"
      aliases:
        - "Spa"
    switch.opnpool_aux1_circuit:
      name: "Vacuum"
      room: "Pool"
    switch.opnpool_aux2_circuit:
      name: "Light"
      room: "Pool"
    climate.opnpool_pool_heater:
      name: "water"
      room: "Pool"

    # fire alarm
    script.disarm_fire_alarm:
      expose: true
      name: "Disarm Fire Alarm"
      room: "Home"
      aliases:
        - "Disarm Alarm"

    # climate
    sensor.opnpool_last_air_temperature:
      name: "temperature"
      room: "Outside"
    sensor.los_altos_country_club_aqi:
      name: "air quality"
      room: "Outside"
