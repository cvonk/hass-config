google_assistant:
  entity_config:
    # lights

    light.living_room_recessed_lights:
      name: "Living room light"
      room: "Living room"
    switch.sonoff_standing_lamp:
      name: "Standing lamp"
      room: "Living room"
      aliases:
        - "Floor lamp"
    switch.sonoff_reading_light:
      name: "Reading light"
      room: "Living room"
    light.sonoff_christmas_tree:
      name: "Christmas tree"
      room: "Living room"
    light.dining_room_chandelier:
      name: "Dining light"
      room: "Dining room"

    # OPNpool

    switch.opnpool_pool_circuit:
      name: Circuit
      room: Pool
    switch.opnpool_spa_circuit:
      name: Circuit
      room: Pool
      aliases:
        - Spa
    switch.opnpool_aux1_circuit:
      name: Pump
      room: Pool
    switch.opnpool_aux2_circuit:
      name: Light
      room: Pool
    climate.opnpool_pool_heater:
      name: water
      room: Pool

    # fire alarm

    script.disarm_fire_alarm:
      expose: true
      name: "Disarm Fire Alarm"
      room: "Home"

    # climate

    sensor.opnpool_last_outside_air_temperature:
      name: temperature
      room: Outside
    sensor.los_altos_country_club_aqi:
      name: air quality
      room: Outside
