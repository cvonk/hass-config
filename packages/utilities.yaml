template:
  - binary_sensor:
      - name: "Utilities Flo shutoff warning"
        state: >-
          {% set value = states('binary_sensor.flo_shutoff_pending_system_alerts') %}
          {% if value != 'unavailable' and value != 'unknown' %}
          {{    value == 'on' }}
          {% else %}
          {{     value }}
          {% endif %}

      - name: "Utilities Eagle 200 warning"
        state: >-
          {% set value = states('sensor.eagle_200_meter_power_demand') %}
          {% if value != 'unavailable' and value != 'unknown' %}
          {{    not value }}
          {% else %}
          {{     value }}
          {% endif %}

  - sensor:
      - name: "Nr of utilities warnings"
        icon: mdi:alert
        state: >-
          {{
              states.binary_sensor | 
              selectattr('entity_id', 'match', 'binary_sensor\.utilities_.*_warning') |
              selectattr('state', 'eq', 'on') | list | count
          }}

      - unique_id: flo_valve_inside_water_flow_rate_per_hour
        name: "Flo valve inside water flow rate per hour"
        device_class: volume_flow_rate
        unit_of_measurement: "gal/h"
        state: >-
          {% set value = states('sensor.flo_shutoff_water_flow_rate') %}
          {% if value != 'unavailable' and value != 'unknown' %}
          {{    value | float * 60.0 }}
          {% else %}
          {{     value }}
          {% endif %}
