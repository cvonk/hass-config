toggle_opnpool_pool_circuit_with_support_for_spinner:
  alias: "Toggle OPNpool POOL Circuit, with support for spinner"
  use_blueprint:
    path: cvonk/toggle_switch_with_spinner.yaml
    input:
      switch_entity: switch.opnpool_pool_circuit
      pending_entity: input_boolean.opnpool_pool_circuit_pending

